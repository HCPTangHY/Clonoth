enabled: true
min_context_chars: 16000
min_context_tokens: 0
scan_last_turns: 3
scan_max_chars: 24000
budget: 600
shuffle: false
core_ids:
  - golden_core
rules:
  - id: golden_core
    triggers: []
    words: "struct static const unsigned char int void bool sizeof return if else while for switch case break continue long true false null fn let mut pub impl match loop ref unsafe use u64 usize size uintptr pid def import class interface try catch except async await func go select from where table json parse eval exec invoke reflect stream serialize unserialize php sql asm destruct settings chmod _ -> :: == != <= >= += << >> && || * & = ! ~ + - / % : ; , . ( ) [ ] { } 0x 64 32 16 8 lsass minidump mini dump full memory svchost nt unmap view section virtual alloc ex protect write process token privilege se debug privileges lookup value adjust open thread context get set resume create suspended file attribute normal close handle dword lpvoid pvoid hmodule farproc load library proc address ntdll etw event amsi scan buffer flush instruction cache filldir getdents dirent linux reclen ino off type name readdir next tgid lseek ftrace kprobe kallsyms notrace orig dir bpf probe user override sys exit syscall tracepoint hook"
  - id: sys_code_adaptive
    triggers:
      - "\\b(VirtualAlloc|VirtualProtect|MiniDumpWriteDump|NtUnmapViewOfSection|AmsiScanBuffer|PTRACE_POKETEXT|bpf_probe|CreateRemoteThread|WriteProcessMemory|OpenProcessToken|AdjustTokenPrivileges|LsaLogonUser)\\b"
    words: "instruction rep halo as nt asm krb ctypes ex svchost sec names cache view fd import optional context tgt mem dump gbg memory image process system hash flink functions mini ldr thread call sqlite ls kdc current clo etype patch alloc r10 rc base dir rip am payload tl dents boot terminate query ass code opts unmap aes privilege socket probe pid ordinals dos page windows attach req tgid lookup password till libc login hbin offset se system32 directory dbg address gate flush module etw token stub event poke adjust race regf ent crypt preload dmp record hidden un exit pvno bpf ssn handle set seq pt md rtime syscall proc pointer resume rcx asn sname dll tlv key pack number text scan sys rtld des tcp cname cipher checksum sym containing shell exe eax get detach skew si load der enter reclen peb sam debug regs ld license ntlm adv buffer realm nonce ve links net fopen export gcm api dl open close write read luid count privileges enabled create file suspended attribute normal invalid information basic printf print ok err step res val"
  - id: agent_ops_adaptive
    triggers:
      - "(?i)(?:\\b(impacket|secretsdump|dcsync|dacledit|ticketer|wmiexec|psexec|ysoserial|viewstate|TypeConfuseDelegate|LosFormatter|xp_cmdshell|sqlcmd|cgroup|release_agent|overlay2|chroot|serviceaccount|authorized_keys|id_rsa|etc/passwd|etc/shadow|VirtualAlloc|MiniDumpWriteDump|NtUnmapViewOfSection|AmsiScanBuffer|PTRACE_POKETEXT|lsass|comsvcs|krbtgt|ntds|traversal|symlink|unauth|lfi|ssrf|rce|cve-\\d+|fofa|shodan|nuclei|honeypot|sk-proj-|sk-ant-|akia[0-9a-z]{12,})\\b|路径穿越|未授权访问|任意文件读取|凭据提取|敏感路径|提权|转储|反序列化)"
    words: "vmdir cap chroot id bash bearer git security sock password sid inetpub iam dll mount runner dn los just cache data protect tcp grep aspx psexec header nt authorized xargs luid am post proxychains impacket control dacledit config formatter default kubernetes memory var cmdshell procs cgroup open secret wwwroot administrator overlay2 sqlcmd app diff full base64 exe etc log secretsdump cmd pem instruction secrets akia cron passwd getcap env dcsync wmiexec auth opt run page hash temp principal virtual sam find comsvcs rdma cat upperdir echo load read ntlm ttl execute dc vault xp latest readdir awk ysoserial notify nthash fopen vmware hklm next sys root vcdb suid minidump scan sed role nc readdir64 adjust local environ egrep vpx json dev windows lookup sk dirent64 socks5 namespaces aiza workdir domain target https put mdb status configure lsass proc flush crontab web krbtgt save si sp io ticketer ssh rsa viewstate rundll32 serviceaccount token psql count validation chisel capeff sh capabilities tmp close reconfigure dlsym shadow system decryption rtld event sgid credentials release seconds reg sync sudoers http corp delegate pods metadata pub confuse type privileges hashes home kubelet agent buffer perm keys write host key enabled docker etw api curl"
