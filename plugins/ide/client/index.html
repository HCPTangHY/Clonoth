<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDE</title>
<style>
/* [AutoC 2026-08-24] IDE 面板页 v3：单一主页 + 顶部标签栏（VSCode 语义）。
   文件树是第一个固定标签「文件」，其余标签是打开的文件；视图切换全部
   经标签栏完成，不存在分栏。只写结构与变量名映射，主题由宿主注入。 */
:root {
  --bg: var(--duties-bg, #f1f0ee);
  --card: var(--duties-card, #ffffff);
  --text: var(--duties-text, #1a1a1a);
  --secondary: var(--duties-secondary, #5b5b5b);
  --tertiary: var(--duties-tertiary, #9a9a9a);
  --border: var(--duties-border, #e2e0dc);
  --hover: var(--duties-hover, rgba(0,0,0,0.04));
  --accent: var(--duties-accent, #feaf2c);
  --mono: var(--duties-font-mono, ui-monospace, monospace);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 12px/1.5 Inter, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── tab bar ── */
.tabbar {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  scrollbar-width: thin;
}
.tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 10px;
  height: 28px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  color: var(--tertiary);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}
.tab:hover { background: var(--hover); }
.tab.active {
  color: var(--text);
  background: var(--card);
  box-shadow: inset 0 2px 0 var(--accent);
}
.tab.preview-tab .nm { font-style: italic; }
.tab .close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  opacity: 0;
}
.tab:hover .close, .tab.active .close { opacity: 1; }
.tab .close:hover { background: var(--hover); color: var(--text); }

/* ── single main view ── */
.view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--card);
}
.status { padding: 12px; font-size: 11px; color: var(--tertiary); }

/* file tree rows */
.node {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 1px 10px;
  border: 0;
  background: transparent;
  color: var(--secondary);
  font-family: var(--mono);
  font-size: 11px;
  text-align: left;
  cursor: pointer;
  user-select: none;
}
.node:hover { background: var(--hover); }
.node.active { color: var(--text); background: var(--hover); }
.node .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .sz { margin-left: auto; flex-shrink: 0; font-size: 9px; color: var(--tertiary); }
.node .tw { flex-shrink: 0; width: 12px; text-align: center; color: var(--tertiary); }
.tree-root { padding: 6px 0; }
.tree-path {
  padding: 4px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-bottom: 1px solid var(--border);
}

/* file content */
.pv-img { display: block; max-width: 100%; margin: 8px auto; }
.pv-code { margin: 0; padding: 8px 0; font-family: var(--mono); font-size: 11px; line-height: 1.5; }
.pv-line { display: flex; white-space: pre; }
.pv-line:hover { background: var(--hover); }
.pv-ln { flex-shrink: 0; width: 3.6em; padding-right: 1em; text-align: right; color: var(--tertiary); user-select: none; }
.pv-lt { flex: 1; padding-right: 12px; }
</style>
</head>
<body>
<div class="tabbar" id="tabbar"></div>
<div class="view" id="view"></div>
<script>
/* [AutoC 2026-08-24] IDE 面板 v3：单主页 + 标签栏切换。
 *
 * 「文件」标签固定在第一、不可关闭，内容是工作区文件树。单击树中文件
 * 打开预览标签（斜体，至多一个，再单击别的文件时复用替换）；双击固定。
 * 标签可点切换、✕ 或中键关闭。数据全部来自 supervisor REST，鉴权经
 * 宿主 boot 对象注入。 */

const boot = (window.parent && window.parent.__CLONOTH_BOOT__) || {};
const TOKEN = boot.token || '';
const SESSION_ID = boot.sessionId || '';

const IMAGE_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg','ico','bmp','avif']);
const MAX_TEXT_BYTES = 512 * 1024;
const TREE_TAB = '::tree';

const tabbarEl = document.getElementById('tabbar');
const viewEl = document.getElementById('view');

async function api(path) {
  const resp = await fetch('/v1' + path, {
    headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {},
  });
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).detail || ''; } catch (e) {}
    throw new Error(resp.status + (detail ? ' ' + detail : ''));
  }
  return resp;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(n) {
  if (n == null) return '';
  if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'M';
  if (n > 1024) return (n / 1024).toFixed(1) + 'K';
  return n + 'B';
}

function extOf(path) {
  const name = String(path).split('/').pop() || '';
  const dot = name.lastIndexOf('.');
  return dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
}

function baseName(path) {
  return String(path).split('/').pop() || String(path);
}

// ── tab state ────────────────────────────────────────────────────────────
// tabs: [{ path, pinned }]，path === TREE_TAB 是文件树标签，永远在首位。
// 文件标签中至多一个未固定（预览标签）。

let tabs = [{ path: TREE_TAB, pinned: true }];
let activePath = TREE_TAB;

function findTab(path) {
  return tabs.find((t) => t.path === path) || null;
}

function findPreviewTab() {
  return tabs.find((t) => t.path !== TREE_TAB && !t.pinned) || null;
}

function activate(path) {
  if (activePath === path) return;
  activePath = path;
  renderTabs();
  renderView();
}

function openFileTab(path, pinned) {
  const existing = findTab(path);
  if (existing) {
    if (pinned) existing.pinned = true;
  } else if (pinned) {
    tabs.push({ path, pinned: true });
  } else {
    const preview = findPreviewTab();
    if (preview) preview.path = path;
    else tabs.push({ path, pinned: false });
  }
  activePath = path;
  renderTabs();
  renderView();
}

function closeTab(path) {
  if (path === TREE_TAB) return;
  const idx = tabs.findIndex((t) => t.path === path);
  if (idx < 0) return;
  tabs.splice(idx, 1);
  if (activePath === path) {
    const next = tabs[Math.min(idx, tabs.length - 1)] || tabs[0];
    activePath = next.path;
  }
  renderTabs();
  renderView();
}

function renderTabs() {
  tabbarEl.innerHTML = '';
  for (const tab of tabs) {
    const isTree = tab.path === TREE_TAB;
    const el = document.createElement('div');
    el.className = 'tab'
      + (tab.path === activePath ? ' active' : '')
      + (!isTree && !tab.pinned ? ' preview-tab' : '');
    el.title = isTree ? '工作区文件' : tab.path;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = isTree ? '文件' : baseName(tab.path);
    el.appendChild(nm);
    if (!isTree) {
      const close = document.createElement('button');
      close.className = 'close';
      close.type = 'button';
      close.textContent = '✕';
      close.title = '关闭';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(tab.path);
      });
      el.appendChild(close);
      el.addEventListener('auxclick', (e) => {
        if (e.button === 1) closeTab(tab.path);
      });
      el.addEventListener('dblclick', () => {
        if (!tab.pinned) { tab.pinned = true; renderTabs(); }
      });
    }
    el.addEventListener('click', () => activate(tab.path));
    tabbarEl.appendChild(el);
  }
}

// ── view rendering ───────────────────────────────────────────────────────

let blobUrl = null;
let loadSeq = 0;
let treeBooted = false;   // 文件树只初始化一次，切换标签时保留展开状态

function releaseBlob() {
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
}

function showStatus(text) {
  releaseBlob();
  viewEl.innerHTML = '<div class="status">' + esc(text) + '</div>';
}

function renderView() {
  if (activePath === TREE_TAB) {
    releaseBlob();
    if (treeBooted) {
      viewEl.innerHTML = '';
      viewEl.appendChild(treeRootEl);
    } else {
      bootTree();
    }
    return;
  }
  loadFileIntoView(activePath);
}

// ── file tree ────────────────────────────────────────────────────────────

let treeRootEl = document.createElement('div');

async function fetchTree(subPath) {
  const params = new URLSearchParams();
  if (SESSION_ID) params.set('session_id', SESSION_ID);
  if (subPath) params.set('sub_path', subPath);
  params.set('depth', '2');
  const resp = await api('/workspace/tree?' + params);
  return resp.json();
}

function renderNode(node, depth, container) {
  const isDir = node.type === 'directory';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'node';
  btn.style.paddingLeft = (depth * 14 + 10) + 'px';
  btn.title = node.path;
  const badge = node.truncated ? ' (' + (node.childDirs || 0) + 'd ' + (node.childFiles || 0) + 'f)' : '';
  btn.innerHTML =
    '<span class="tw">' + (isDir ? '▸' : '') + '</span>' +
    '<span class="nm">' + esc(node.name) + (badge ? '<span style="color:var(--tertiary)">' + esc(badge) + '</span>' : '') + '</span>' +
    (isDir ? '' : '<span class="sz">' + esc(fmtSize(node.size)) + '</span>');
  container.appendChild(btn);

  const childBox = document.createElement('div');
  childBox.style.display = 'none';
  container.appendChild(childBox);

  let loaded = false;
  let expanded = false;

  function setExpanded(next) {
    expanded = next;
    childBox.style.display = expanded ? '' : 'none';
    btn.querySelector('.tw').textContent = isDir ? (expanded ? '▾' : '▸') : '';
  }

  btn.addEventListener('click', async () => {
    if (!isDir) {
      treeRootEl.querySelectorAll('.node.active').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');
      openFileTab(node.path, false);
      return;
    }
    if (expanded) { setExpanded(false); return; }
    if (!loaded) {
      loaded = true;
      let children = node.children || [];
      if (node.truncated || children.length === 0) {
        try {
          const data = await fetchTree(node.path === '.' ? '' : node.path);
          children = (data.tree && data.tree.children) || [];
        } catch (e) {
          children = [];
        }
      }
      childBox.innerHTML = '';
      children.forEach((c) => renderNode(c, depth + 1, childBox));
      if (children.length === 0) {
        childBox.innerHTML = '<div class="status">空目录</div>';
      }
    }
    setExpanded(true);
  });

  btn.addEventListener('dblclick', () => {
    if (!isDir) openFileTab(node.path, true);
  });
}

async function bootTree() {
  if (!SESSION_ID) {
    viewEl.innerHTML = '<div class="status">缺少会话上下文</div>';
    return;
  }
  viewEl.innerHTML = '<div class="status">加载中…</div>';
  try {
    const data = await fetchTree('');
    treeRootEl = document.createElement('div');
    treeRootEl.className = 'tree-root';
    if (data.workspace_path) {
      const p = document.createElement('div');
      p.className = 'tree-path';
      p.textContent = data.workspace_path;
      p.title = data.workspace_path;
      treeRootEl.appendChild(p);
    }
    const children = (data.tree && data.tree.children) || [];
    if (children.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'status';
      empty.textContent = '空目录或未设置工作区';
      treeRootEl.appendChild(empty);
    } else {
      children.forEach((c) => renderNode(c, 0, treeRootEl));
    }
    treeBooted = true;
    viewEl.innerHTML = '';
    viewEl.appendChild(treeRootEl);
  } catch (err) {
    viewEl.innerHTML = '<div class="status">加载失败：' + esc(err.message) + '</div>';
  }
}

// ── file content ─────────────────────────────────────────────────────────

function renderText(text) {
  releaseBlob();
  viewEl.innerHTML = '';
  let truncated = false;
  if (text.length > MAX_TEXT_BYTES) {
    text = text.slice(0, MAX_TEXT_BYTES);
    truncated = true;
  }
  const pre = document.createElement('pre');
  pre.className = 'pv-code';
  const frag = document.createDocumentFragment();
  text.split('\n').forEach((line, i) => {
    const row = document.createElement('div');
    row.className = 'pv-line';
    const no = document.createElement('span');
    no.className = 'pv-ln';
    no.textContent = String(i + 1);
    const lt = document.createElement('span');
    lt.className = 'pv-lt';
    lt.textContent = line;
    row.appendChild(no);
    row.appendChild(lt);
    frag.appendChild(row);
  });
  pre.appendChild(frag);
  viewEl.appendChild(pre);
  if (truncated) {
    const note = document.createElement('div');
    note.className = 'status';
    note.textContent = '文件过大，仅显示前 ' + MAX_TEXT_BYTES + ' 字节';
    viewEl.appendChild(note);
  }
}

async function loadFileIntoView(path) {
  const seq = ++loadSeq;
  showStatus('加载中…');
  let resp;
  try {
    resp = await api('/sessions/' + encodeURIComponent(SESSION_ID) + '/file?path=' + encodeURIComponent(path));
  } catch (err) {
    if (seq !== loadSeq) return;
    showStatus('加载失败：' + err.message);
    return;
  }
  if (seq !== loadSeq) return;
  const ct = resp.headers.get('content-type') || '';
  const ext = extOf(path);
  if (ct.startsWith('image/') || IMAGE_EXTS.has(ext)) {
    const blob = await resp.blob();
    releaseBlob();
    blobUrl = URL.createObjectURL(blob);
    viewEl.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'pv-img';
    img.src = blobUrl;
    img.alt = path;
    viewEl.appendChild(img);
    return;
  }
  const buf = await resp.arrayBuffer();
  if (buf.byteLength > MAX_TEXT_BYTES * 4) {
    showStatus('二进制文件（' + buf.byteLength + ' B），不支持预览');
    return;
  }
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < Math.min(bytes.length, 8192); i++) {
    if (bytes[i] === 0) {
      showStatus('二进制文件（' + buf.byteLength + ' B），不支持预览');
      return;
    }
  }
  renderText(new TextDecoder('utf-8').decode(bytes));
}

// ── boot ─────────────────────────────────────────────────────────────────

renderTabs();
renderView();
</script>
</body>
</html>
