<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDE</title>
<script src="vendor/codemirror.js"></script>
<script src="vendor/marked.js"></script>
<style>
/* [AutoC 2026-08-24] IDE 面板页：单一主页 + 顶部标签栏 + 文本编辑。
   只写结构与变量名映射，不抄宿主值；主题变量与滚动条规则由宿主
   themeBridge 在 iframe load 后注入。 */
:root {
  /* 与宿主右栏同底：宿主 aside 用 --duties-panel，没有 --duties-card。
     视图区用更浅的 --duties-bg 区分内容区。 */
  --bg: var(--duties-panel, #e8e7e5);
  --card: var(--duties-bg, #f1f0ee);
  --text: var(--duties-text, #1a1a1a);
  --secondary: var(--duties-secondary, #5b5b5b);
  --tertiary: var(--duties-tertiary, #9a9a9a);
  --border: var(--duties-border, #e2e0dc);
  --hover: var(--duties-hover, rgba(0,0,0,0.04));
  --accent: var(--duties-accent, #feaf2c);
  --mono: var(--duties-font-mono, ui-monospace, monospace);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 12px/1.5 Inter, system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── tab bar ── */
.tabbar {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  scrollbar-width: thin;
}
.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 6px 0 10px;
  height: 26px;
  max-width: 180px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  color: var(--tertiary);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}
.tab:hover { background: var(--hover); }
.tab.active {
  color: var(--text);
  background: var(--card);
  box-shadow: inset 0 2px 0 var(--accent);
}
.tab.preview-tab .nm { font-style: italic; }
.tab .nm {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab .dot { display: none; color: var(--accent); font-size: 9px; }
.tab.dirty .dot { display: inline; }
.tab .close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  opacity: 0;
}
.tab:hover .close, .tab.active .close { opacity: 1; }
.tab .close:hover { background: var(--hover); color: var(--text); }

/* ── single main view ── */
.view {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--card);
  display: flex;
  flex-direction: column;
}
.status { padding: 12px; font-size: 11px; color: var(--tertiary); }

/* file tree rows */
.node {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 100%;
  padding: 1px 10px;
  border: 0;
  background: transparent;
  color: var(--secondary);
  font-family: var(--mono);
  font-size: 11px;
  text-align: left;
  cursor: pointer;
  user-select: none;
}
.node:hover { background: var(--hover); }
.node.active { color: var(--text); background: var(--hover); }
.node .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .sz { margin-left: auto; flex-shrink: 0; font-size: 9px; color: var(--tertiary); }
.node .tw { flex-shrink: 0; width: 12px; text-align: center; color: var(--tertiary); }
.tree-root { padding: 6px 0; }
.tree-path {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tertiary);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.tree-path .ws {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* git 入口按钮与浮层 */
.git-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 1px 4px;
  border: 0;
  background: transparent;
  color: var(--tertiary);
  cursor: pointer;
}
.git-btn:hover { color: var(--text); }
.git-btn svg { width: 12px; height: 12px; display: block; }
.git-badge {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--bg);
  background: var(--tertiary);
  border-radius: 6px;
  padding: 0 4px;
  line-height: 12px;
  min-width: 12px;
  text-align: center;
}
.git-pop {
  position: absolute;
  top: 100%;
  right: 0;
  z-index: 40;
  width: 260px;
  max-height: 320px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}
.git-pop-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text);
}
.git-pop-head .branch { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.git-pop-head button {
  flex-shrink: 0;
  border: 0;
  background: transparent;
  color: var(--tertiary);
  cursor: pointer;
  padding: 0 2px;
  font-size: 12px;
}
.git-pop-head button:hover { color: var(--text); }
.git-pop-body { overflow-y: auto; flex: 1; min-height: 0; }
.git-pop-empty { padding: 12px 10px; font-size: 11px; color: var(--tertiary); }
.git-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 3px 10px;
  border: 0;
  background: transparent;
  text-align: left;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text);
  cursor: pointer;
}
.git-row:hover { background: var(--bg); }
.git-row .st {
  flex-shrink: 0;
  width: 14px;
  text-align: center;
  font-weight: 700;
}
.git-row .st.M { color: #b76d01; }
.git-row .st.A { color: #50a14f; }
.git-row .st.D { color: #e45649; }
.git-row .st.R { color: #4078f2; }
.git-row .st.\? { color: var(--tertiary); }
.git-row .st.staged { opacity: 0.55; }
.git-row .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* file content */
.pv-img { display: block; max-width: 100%; margin: 8px auto; }
/* CodeMirror 容器撑满视图区 */
.cm-host {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--card);
}
.cm-host .cm-editor {
  flex: 1;
  min-height: 0;
  font-size: 12px;
}
.cm-host .cm-scroller {
  font-family: var(--mono);
  line-height: 1.5;
  overflow: auto;
}
.cm-host .cm-content {
  padding: 8px 0;
  caret-color: var(--text);
}
.cm-host .cm-gutters {
  background: var(--bg);
  color: var(--tertiary);
  border-right: 1px solid var(--border);
  border-left: 0;
}
.cm-host .cm-activeLineGutter {
  background: var(--hover);
}
.cm-host .cm-activeLine {
  background: var(--hover);
}
.cm-host .cm-selectionBackground,
.cm-host.cm-focused .cm-selectionBackground {
  background: rgba(128, 128, 128, 0.25) !important;
}
.cm-host .cm-cursor {
  border-left-color: var(--text);
}
.cm-host .cm-editor.cm-focused {
  outline: none;
}

/* ── CodeMirror 面板（搜索替换等）上妆：宿主变量重绘 ── */
.cm-host .cm-panels {
  background: var(--bg);
  color: var(--text);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.cm-host .cm-panel {
  padding: 6px 10px;
  font-family: var(--mono);
  font-size: 11px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.cm-host .cm-textfield {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 11px;
  outline: none;
}
.cm-host .cm-textfield:focus {
  border-color: var(--accent);
}
.cm-host .cm-button {
  background: var(--card);
  color: var(--secondary);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 8px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  background-image: none;
}
.cm-host .cm-button:hover {
  color: var(--text);
  border-color: var(--text);
  background-image: none;
}
.cm-host .cm-panel label {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--secondary);
  font-size: 10px;
  margin: 0;
}
.cm-host .cm-panel input[type="checkbox"] {
  accent-color: var(--accent);
}
.cm-host .cm-searchMatch {
  background: rgba(254, 175, 44, 0.18);
  outline: 1px solid rgba(254, 175, 44, 0.35);
}
.cm-host .cm-searchMatch-selected {
  background: rgba(254, 175, 44, 0.4);
}

/* ── status bar：等高同色点击分栏，无独立按钮 ── */
.statusbar {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tertiary);
  background: var(--bg);
  height: 22px;
}
.statusbar .seg {
  display: flex;
  align-items: center;
  padding: 0 10px;
  white-space: nowrap;
}
.statusbar .seg.grow {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.statusbar .seg.clickable {
  cursor: pointer;
  color: var(--secondary);
}
.statusbar .seg.clickable:hover {
  background: var(--hover);
  color: var(--text);
}
.statusbar .hint-dirty { color: var(--accent); }
.statusbar .hint-error { color: #c0392b; }

/* ── tabbar 右端常驻保存 ── */
.tabbar .bar-end {
  margin-left: auto;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.tabbar .save-btn {
  display: none;
  align-items: center;
  gap: 4px;
  height: 100%;
  padding: 0 10px;
  border: 0;
  border-left: 1px solid var(--border);
  background: transparent;
  color: var(--secondary);
  cursor: pointer;
}
.tabbar .save-btn.show { display: flex; }
.tabbar .save-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.tabbar .save-btn:disabled { opacity: 0.35; cursor: default; }
.tabbar .save-btn svg { width: 14px; height: 14px; display: block; }
.tabbar .save-btn .dirty-dot { color: var(--accent); font-size: 9px; line-height: 1; }

/* ── Markdown 渲染视图 ── */
.md-body {
  padding: 12px 18px 24px;
  font-size: 12px;
  line-height: 1.65;
  color: var(--text);
  overflow-wrap: break-word;
}
.md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
  margin: 1em 0 0.5em;
  line-height: 1.3;
  color: var(--text);
}
.md-body h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
.md-body h2 { font-size: 1.3em; border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
.md-body h3 { font-size: 1.15em; }
.md-body p { margin: 0.5em 0; }
.md-body a { color: var(--accent); text-decoration: none; }
.md-body a:hover { text-decoration: underline; }
.md-body code {
  font-family: var(--mono);
  font-size: 0.92em;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.1em 0.35em;
}
.md-body pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 12px;
  overflow-x: auto;
  margin: 0.6em 0;
}
.md-body pre code {
  background: transparent;
  border: 0;
  padding: 0;
  font-size: 11px;
  line-height: 1.5;
}
.md-body blockquote {
  margin: 0.6em 0;
  padding: 2px 12px;
  border-left: 3px solid var(--border);
  color: var(--secondary);
}
.md-body ul, .md-body ol { margin: 0.5em 0; padding-left: 1.6em; }
.md-body li { margin: 0.15em 0; }
.md-body table {
  border-collapse: collapse;
  margin: 0.6em 0;
  font-size: 11px;
}
.md-body th, .md-body td {
  border: 1px solid var(--border);
  padding: 4px 10px;
  text-align: left;
}
.md-body th { background: var(--bg); }
.md-body hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
.md-body img { max-width: 100%; }

/* git 整页视图 */
.git-page { padding: 0 0 12px; font-size: 12px; }
.git-page-top {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
}
.git-back {
  border: 0; background: transparent; color: var(--secondary);
  font-size: 11px; cursor: pointer; padding: 2px 4px;
}
.git-back:hover { color: var(--text); }
.git-page-branch {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px;
  font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.git-iconbtn {
  border: 0; background: transparent; color: var(--tertiary);
  cursor: pointer; font-size: 13px; padding: 0 4px;
}
.git-iconbtn:hover { color: var(--text); }
.git-commit {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.git-commit-msg {
  width: 100%; resize: vertical;
  font-family: var(--mono); font-size: 11px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  box-sizing: border-box;
}
.git-commit-msg:focus { outline: none; border-color: var(--text); }
.git-commit-btn {
  align-self: flex-start;
  padding: 4px 14px;
  border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 11px; cursor: pointer;
}
.git-commit-btn:hover:not(:disabled) { border-color: var(--text); }
.git-commit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.git-group { margin-top: 4px; }
.git-group-head {
  padding: 4px 12px;
  font-size: 10px; color: var(--tertiary);
  border-bottom: 1px solid var(--border);
}
.git-page-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 12px;
  font-family: var(--mono); font-size: 11px;
}
.git-page-row:hover { background: var(--bg); }
.git-page-row .st { flex-shrink: 0; width: 14px; text-align: center; font-weight: 700; }
.git-page-row .st.M { color: #b76d01; }
.git-page-row .st.A { color: #50a14f; }
.git-page-row .st.D { color: #e45649; }
.git-page-row .st.R { color: #4078f2; }
.git-page-row .st.\? { color: var(--tertiary); }
.git-page-row .p {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text);
}
.git-page-row .p:hover { color: #4078f2; text-decoration: underline; }
.git-row-act {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border: 1px solid var(--border); background: transparent;
  color: var(--secondary); font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0;
}
.git-row-act:hover { color: var(--text); border-color: var(--text); }
.git-log-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 3px 12px;
  font-size: 11px;
}
.git-log-row:hover { background: var(--bg); }
.git-log-hash {
  flex-shrink: 0;
  font-family: var(--mono); font-size: 10px;
  color: #4078f2;
}
.git-log-msg {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text);
}
.git-log-time { flex-shrink: 0; font-size: 10px; color: var(--tertiary); }
</style>
</head>

<div class="view" id="view"></div>
<div class="statusbar" id="statusbar"></div>
<script>
/* [AutoC 2026-08-24] IDE 面板：单主页 + 标签栏切换 + 文本编辑保存。
 *
 * 「文件」标签固定在第一、不可关闭，内容是工作区文件树。单击树中文件
 * 打开预览标签（斜体，至多一个，再单击别的文件时复用替换）；双击固定；
 * 编辑预览标签内容会自动将其固定（VSCode 语义）。文本文件直接可编辑，
 * 脏状态在标签上显示圆点，Ctrl+S 或状态栏按钮保存，写回走本插件注册的
 * PUT /v1/plugins/ide/file。 */

const boot = (window.parent && window.parent.__CLONOTH_BOOT__) || {};
const TOKEN = boot.token || '';
const SESSION_ID = boot.sessionId || '';

const IMAGE_EXTS = new Set(['png','jpg','jpeg','gif','webp','svg','ico','bmp','avif']);

// [AutoC 2026-08-24] Tab 缩进宽度可调：状态栏按钮在 2/4/8 间循环，
// 偏好持久化到 localStorage，作用于所有文本标签页（重建编辑器生效）。
const LS_INDENT = 'clonoth_ide_indent';
const INDENT_STEPS = [2, 4, 8];
function readIndent() {
  try {
    const n = Number(localStorage.getItem(LS_INDENT));
    if (INDENT_STEPS.includes(n)) return n;
  } catch (e) {}
  return 2;
}
let indentWidth = readIndent();
const MAX_TEXT_BYTES = 512 * 1024;
const TREE_TAB = '::tree';

const tabbarEl = document.getElementById('tabbar');
const viewEl = document.getElementById('view');
const statusbarEl = document.getElementById('statusbar');

async function api(path, init) {
  init = init || {};
  init.headers = Object.assign(
    {}, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}, init.headers || {});
  const resp = await fetch('/v1' + path, init);
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).detail || ''; } catch (e) {}
    throw new Error(resp.status + (detail ? ' ' + detail : ''));
  }
  return resp;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(n) {
  if (n == null) return '';
  if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + 'M';
  if (n > 1024) return (n / 1024).toFixed(1) + 'K';
  return n + 'B';
}

function extOf(path) {
  const name = String(path).split('/').pop() || '';
  const dot = name.lastIndexOf('.');
  return dot > 0 ? name.slice(dot + 1).toLowerCase() : '';
}

function baseName(path) {
  // diff 标签的 path 带 ' (diff)' 后缀，显示时剥离
  return String(path).replace(/ \(diff\)$/, '').split('/').pop() || String(path);
}

// ── tab state ────────────────────────────────────────────────────────────
// tabs: [{ path, pinned, loaded, kind, text, savedText, dirty, scroll,
//          blobUrl, note }]。path === TREE_TAB 是文件树标签，永远在首位。
// 文件标签中至多一个未固定（预览标签）；编辑预览标签会自动将其固定。

let tabs = [{ path: TREE_TAB, pinned: true }];
let activePath = TREE_TAB;
let viewPath = null;      // 当前视图为哪个标签渲染，用于切换前保存滚动位置
let saveHint = '';        // 状态栏一次性提示（保存成功/失败）

function newFileTab(path, pinned) {
  // mode: MD 文件专属，'render'（默认渲染）或 'edit'（编辑器）。
  // scroll 存比例（scrollTop / 可滚动高度）而非像素：渲染与编辑两种模式
  // 的滚动容器与内容高度都不同，像素值无法对应。cursor 存编辑态游标位置。
  return { path, pinned, loaded: false, kind: '', text: '', savedText: '',
           dirty: false, scroll: 0, cursor: 0, blobUrl: null, note: '', mode: 'render',
           diffs: null, afterText: '' };
}

function newDiffTab(path, diffs) {
  return { path, pinned: true, loaded: false, kind: 'diff', text: '', savedText: '',
           dirty: false, scroll: 0, cursor: 0, blobUrl: null, note: '', mode: 'render',
           diffs, afterText: '' };
}

function scrollFraction(el) {
  const range = el.scrollHeight - el.clientHeight;
  return range > 0 ? el.scrollTop / range : 0;
}

function applyScrollFraction(el, frac) {
  const range = el.scrollHeight - el.clientHeight;
  el.scrollTop = range > 0 ? frac * range : 0;
}

function isMarkdown(path) {
  return /\.(md|markdown)$/i.test(String(path));
}

// [AutoC 2026-08-24] 语法高亮语言映射。CodeMirror 语言按独立包分发，
// 这里只接入常用语言，按扩展名匹配；未命中的文件走无高亮纯文本。
// legacy-modes 覆盖 shell/toml/dockerfile/lua/ruby。
// 浅色高对比语法配色。tags 来自 @lezer/highlight，颜色值为最终 CSS；
// 注释与正文引用宿主变量，其余用 Atom One Light 的成熟浅色色系。
let _hlStyle = null;
function hlStyle() {
  if (_hlStyle === null) {
    const t = CM.tags;
    // [AutoC 2026-08-24] 细线字体下区分度不足：关键字/类型/函数加粗
    // 补偿，字符串保持常规（绿色已足够显眼），数字加粗。
    _hlStyle = CM.HighlightStyle.define([
      { tag: [t.keyword, t.controlKeyword, t.moduleKeyword], color: '#a626a4', fontWeight: 'bold' },
      { tag: [t.string, t.special(t.string), t.regexp], color: '#50a14f' },
      { tag: t.comment, color: 'var(--duties-tertiary, #9a9a9a)', fontStyle: 'italic' },
      { tag: [t.number, t.bool, t.null], color: '#b76b01', fontWeight: 'bold' },
      { tag: [t.atom, t.labelName], color: '#0184bc' },
      { tag: [t.function(t.variableName), t.function(t.propertyName)], color: '#4078f2', fontWeight: 'bold' },
      { tag: [t.typeName, t.className, t.namespace], color: '#c18401', fontWeight: 'bold' },
      { tag: [t.propertyName, t.attributeName], color: '#e45649' },
      { tag: t.tagName, color: '#e45649', fontWeight: 'bold' },
      { tag: t.attributeValue, color: '#50a14f' },
      { tag: [t.operator, t.punctuation, t.separator], color: '#383a42' },
      { tag: [t.variableName, t.name], color: 'var(--duties-text, #1a1a1a)' },
      { tag: [t.heading, t.strong], color: 'var(--duties-text, #1a1a1a)', fontWeight: 'bold' },
      { tag: t.emphasis, fontStyle: 'italic' },
      { tag: t.link, color: 'var(--duties-accent, #feaf2c)' },
      { tag: [t.invalid, t.deleted], color: '#c0392b' },
      { tag: t.inserted, color: '#50a14f' },
      { tag: t.changed, color: '#c18401' },
    ]);
  }
  return _hlStyle;
}

let _langDescs = null;
function languageFor(path) {
  if (_langDescs === null) {
    const { LanguageDescription, StreamLanguage,
            javascript, python, json, html, css, xml, yaml, rust, cpp,
            java, go, sql, php,
            shell, toml, dockerFile, lua, ruby } = CM;
    _langDescs = [
      LanguageDescription.of({ name: 'javascript', extensions: ['js','mjs','cjs'], support: javascript() }),
      LanguageDescription.of({ name: 'typescript', extensions: ['ts','mts','cts'], support: javascript({ typescript: true }) }),
      LanguageDescription.of({ name: 'jsx', extensions: ['jsx'], support: javascript({ jsx: true }) }),
      LanguageDescription.of({ name: 'tsx', extensions: ['tsx'], support: javascript({ jsx: true, typescript: true }) }),
      LanguageDescription.of({ name: 'json', extensions: ['json','jsonl','map'], support: json() }),
      LanguageDescription.of({ name: 'python', extensions: ['py','pyi'], support: python() }),
      LanguageDescription.of({ name: 'html', extensions: ['html','htm'], support: html() }),
      LanguageDescription.of({ name: 'css', extensions: ['css'], support: css() }),
      LanguageDescription.of({ name: 'xml', extensions: ['xml','svg','xsd'], support: xml() }),
      LanguageDescription.of({ name: 'yaml', extensions: ['yaml','yml'], support: yaml() }),
      LanguageDescription.of({ name: 'rust', extensions: ['rs'], support: rust() }),
      LanguageDescription.of({ name: 'cpp', extensions: ['c','h','cpp','hpp','cc','cxx','hh'], support: cpp() }),
      LanguageDescription.of({ name: 'java', extensions: ['java'], support: java() }),
      LanguageDescription.of({ name: 'go', extensions: ['go'], support: go() }),
      LanguageDescription.of({ name: 'sql', extensions: ['sql'], support: sql() }),
      LanguageDescription.of({ name: 'php', extensions: ['php'], support: php() }),
      LanguageDescription.of({ name: 'shell', extensions: ['sh','bash','zsh'], support: StreamLanguage.define(shell) }),
      LanguageDescription.of({ name: 'toml', extensions: ['toml'], support: StreamLanguage.define(toml) }),
      LanguageDescription.of({ name: 'dockerfile', extensions: ['dockerfile'], support: StreamLanguage.define(dockerFile) }),
      LanguageDescription.of({ name: 'lua', extensions: ['lua'], support: StreamLanguage.define(lua) }),
      LanguageDescription.of({ name: 'ruby', extensions: ['rb'], support: StreamLanguage.define(ruby) }),
    ];
  }
  return CM.LanguageDescription.matchFilename(_langDescs, String(path));
}

function findTab(path) {
  return tabs.find((t) => t.path === path) || null;
}

function findPreviewTab() {
  return tabs.find((t) => t.path !== TREE_TAB && !t.pinned) || null;
}

function releaseTab(tab) {
  if (tab && tab.blobUrl) { URL.revokeObjectURL(tab.blobUrl); tab.blobUrl = null; }
}

function activate(path) {
  if (activePath === path) return;
  activePath = path;
  renderTabs();
  renderView();
}

function openFileTab(path, pinned) {
  let tab = findTab(path);
  if (tab) {
    if (pinned) tab.pinned = true;
  } else if (pinned) {
    tab = newFileTab(path, true);
    tabs.push(tab);
  } else {
    tab = newFileTab(path, false);
    const preview = findPreviewTab();
    if (preview) {
      releaseTab(preview);
      tabs[tabs.indexOf(preview)] = tab;
    } else {
      tabs.push(tab);
    }
  }
  activePath = path;
  renderTabs();
  renderView();
}

function openDiffTab(path, diffs) {
  // diff 标签页 key 带 ' (diff)' 后缀，与同名文件标签区分。
  const key = path + ' (diff)';
  let tab = findTab(key);
  if (tab) {
    tab.diffs = diffs;
    tab.loaded = false;
  } else {
    tab = newDiffTab(key, diffs);
    tabs.push(tab);
  }
  activePath = key;
  renderTabs();
  renderView();
}

function closeTab(path) {
  if (path === TREE_TAB) return;
  const tab = findTab(path);
  if (!tab) return;
  if (tab.dirty && !confirm('未保存的修改将丢失，确定关闭 ' + baseName(path) + '？')) return;
  const idx = tabs.indexOf(tab);
  releaseTab(tab);
  tabs.splice(idx, 1);
  if (activePath === path) {
    const next = tabs[Math.min(idx, tabs.length - 1)] || tabs[0];
    activePath = next.path;
  }
  renderTabs();
  renderView();
}

function renderTabs() {
  // [AutoC 2026-08-24] 不能 innerHTML 清空整个 tabbar：右端的 bar-end
  // 保存按钮容器会被销毁，导致按钮永久消失。只移除标签元素，bar-end 保留。
  tabbarEl.querySelectorAll('.tab').forEach((el) => el.remove());
  for (const tab of tabs) {
    const isTree = tab.path === TREE_TAB;
    const el = document.createElement('div');
    el.className = 'tab'
      + (tab.path === activePath ? ' active' : '')
      + (!isTree && !tab.pinned ? ' preview-tab' : '')
      + (tab.dirty ? ' dirty' : '');
    el.title = isTree ? '工作区文件' : tab.path;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = isTree ? '文件' : baseName(tab.path);
    el.appendChild(nm);
    if (!isTree) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.textContent = '●';
      el.appendChild(dot);
      const close = document.createElement('button');
      close.className = 'close';
      close.type = 'button';
      close.textContent = '✕';
      close.title = '关闭';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(tab.path);
      });
      el.appendChild(close);
      el.addEventListener('auxclick', (e) => {
        if (e.button === 1) closeTab(tab.path);
      });
      el.addEventListener('dblclick', () => {
        if (!tab.pinned) { tab.pinned = true; renderTabs(); }
      });
    }
    el.addEventListener('click', () => activate(tab.path));
    tabbarEl.insertBefore(el, tabbarEl.querySelector('.bar-end'));
  }
}

// ── view rendering ───────────────────────────────────────────────────────

let loadSeq = 0;
let treeBooted = false;   // 文件树只初始化一次，切换标签时保留展开状态
let treeRootEl = document.createElement('div');

function showStatus(text) {
  viewEl.innerHTML = '<div class="status">' + esc(text) + '</div>';
}

function stashScroll() {
  const tab = viewPath && viewPath !== TREE_TAB ? findTab(viewPath) : null;
  if (!tab || tab.kind !== 'text') return;
  if (tab._view) {
    tab.scroll = scrollFraction(tab._view.scrollDOM);
    tab.cursor = tab._view.state.selection.main.head;
  } else if (isMarkdown(tab.path) && tab.mode === 'render') {
    tab.scroll = scrollFraction(viewEl);
  }
}

function renderView() {
  stashScroll();
  viewPath = activePath;
  if (activePath === TREE_TAB) {
    // Git 整页视图激活时替换文件树显示
    if (gitViewActive) { renderGitView(); renderStatusbar(); return; }
    if (treeBooted) {
      viewEl.innerHTML = '';
      viewEl.appendChild(treeRootEl);
    } else {
      bootTree();
    }
    renderStatusbar();
    return;
  }
  const tab = findTab(activePath);
  if (!tab) { renderStatusbar(); return; }
    if (!tab.loaded) {
    // gitdiff 的数据由 openGitDiffTab 主动加载，renderView 不触发
    if (tab.kind === 'gitdiff') { renderStatusbar(); return; }
    if (tab.kind === 'diff') { loadDiffTab(tab); return; }
    loadFileTab(tab);
    return;
  }
  renderFileTab(tab);
  renderStatusbar();
}

function renderFileTab(tab) {
  if (tab.kind === 'diff') renderDiff(tab);
  else if (tab.kind === 'gitdiff') renderDiff(tab);
  else if (tab.kind === 'text') {
    if (isMarkdown(tab.path) && tab.mode === 'render') renderMarkdown(tab);
    else renderEditor(tab);
  }
  else if (tab.kind === 'image') renderImage(tab);
  else showStatus(tab.note || '不支持预览');
}

// ── diff view ─────────────────────────────────────────────────────────────

function renderDiff(tab) {
  viewEl.innerHTML = '';
  const before = tab.text;
  const after = tab.afterText;
  if (!before && !after) { showStatus('加载中…'); return; }

  const aLines = before.split('\n');
  const bLines = after.split('\n');
  let pre = 0;
  while (pre < aLines.length && pre < bLines.length && aLines[pre] === bLines[pre]) pre++;
  let suf = 0;
  while (suf < aLines.length - pre && suf < bLines.length - pre
         && aLines[aLines.length - 1 - suf] === bLines[bLines.length - 1 - suf]) suf++;

  const ctxBefore = aLines.slice(0, pre);
  const delLines = aLines.slice(pre, aLines.length - suf);
  const addLines = bLines.slice(pre, bLines.length - suf);
  const ctxAfter = aLines.slice(aLines.length - suf);

  const body = document.createElement('div');
  body.className = 'ide-diff-body';
  const addLine = (cls, text) => {
    const div = document.createElement('div');
    div.className = 'ide-diff-line ide-diff-' + cls;
    div.textContent = (cls === 'del' ? '- ' : cls === 'add' ? '+ ' : '  ') + text;
    body.appendChild(div);
  };
  ctxBefore.forEach(l => addLine('ctx', l));
  delLines.forEach(l => addLine('del', l));
  addLines.forEach(l => addLine('add', l));
  ctxAfter.forEach(l => addLine('ctx', l));
  viewEl.appendChild(body);
  // 滚动容器是 viewEl，与普通文件标签（MD 渲染态）一致
  applyScrollFraction(viewEl, tab.scroll);
}

// ── editor ───────────────────────────────────────────────────────────────

function markEdited(tab, text) {
  tab.text = text;
  const wasDirty = tab.dirty;
  const wasPinned = tab.pinned;
  tab.dirty = tab.text !== tab.savedText;
  if (!tab.pinned) tab.pinned = true;   // 编辑预览标签 → 固定
  if (tab.dirty !== wasDirty || tab.pinned !== wasPinned) {
    renderTabs();
    renderStatusbar();
  }
  if (activePath === tab.path) updateSaveButton(tab);
}

function renderEditor(tab) {
  viewEl.innerHTML = '';
  if (tab._view) { tab._view.destroy(); tab._view = null; }
  const host = document.createElement('div');
  host.className = 'cm-host';
  viewEl.appendChild(host);

  const { EditorState, EditorView, keymap, lineNumbers, highlightActiveLine,
          highlightActiveLineGutter, drawSelection, defaultKeymap, history,
          historyKeymap, indentWithTab, syntaxHighlighting,
          defaultHighlightStyle, bracketMatching, foldGutter, indentUnit,
          searchKeymap, highlightSelectionMatches } = CM;
  void defaultHighlightStyle;

  const view = new EditorView({
    parent: host,
    state: EditorState.create({
      doc: tab.text,
      extensions: [
        lineNumbers(),
        highlightActiveLine(),
        highlightActiveLineGutter(),
        drawSelection(),
        history(),
        bracketMatching(),
        foldGutter(),
        // [AutoC 2026-08-24] 默认高亮配色饱和度低、在纸张底上不明显，
        // 换用高对比浅色配色（Atom One Light 色系），注释与正文跟随宿主变量。
        syntaxHighlighting(hlStyle()),
        highlightSelectionMatches(),
        keymap.of([
          ...defaultKeymap,
          ...historyKeymap,
          ...searchKeymap,
          indentWithTab,
          { key: 'Mod-s', run: () => { saveTab(tab); return true; } },
        ]),
        EditorView.updateListener.of((u) => {
          if (u.docChanged) markEdited(tab, u.state.doc.toString());
        }),
        // MD 编辑器失焦时切回渲染。relatedTarget 在面板内控件（状态栏
        // 分栏、保存按钮、标签栏）上时不切，避免点控件时意外切换。
        ...(isMarkdown(tab.path) ? [EditorView.domEventHandlers({
          blur: (e) => {
            const to = e.relatedTarget;
            if (to && (to.closest('.statusbar') || to.closest('.tabbar'))) return;
            // 延迟检查：焦点可能还在面板内其他可聚焦元素之间移动
            setTimeout(() => {
              const ae = document.activeElement;
              if (ae && (ae.closest('.cm-editor') || ae.closest('.statusbar') || ae.closest('.tabbar'))) return;
              if (activePath === tab.path && tab.mode === 'edit') {
                setTabMode(tab, 'render');
              }
            }, 0);
          },
        })] : []),
        // MD 文件编辑时启用 Markdown 语法高亮；其他文件按扩展名匹配
        // 语言包，未命中则无高亮。
        ...(isMarkdown(tab.path)
          ? [CM.markdown({ base: CM.markdownLanguage })]
          : (() => { const d = languageFor(tab.path); return d && d.support ? [d.support] : []; })()),
        // tabSize 决定 Tab 字符显示宽度，indentUnit 决定 Tab 命令插入的空白，
        // 两者都跟随状态栏的缩进偏好。
        EditorState.tabSize.of(indentWidth),
        indentUnit.of(' '.repeat(indentWidth)),
        EditorView.theme({
          '&': { height: '100%' },
          '.cm-scroller': { overflow: 'auto' },
        }),
      ],
    }),
  });
  tab._view = view;
  // 游标位置按文档长度钳制（文档可能被外部改短），滚动按比例恢复。
  const head = Math.min(tab.cursor || 0, view.state.doc.length);
  view.dispatch({ selection: { anchor: head } });
  applyScrollFraction(view.scrollDOM, tab.scroll || 0);
  view.requestMeasure();
}

// [AutoC 2026-08-24] Markdown 渲染：marked 解析 + 本地 sanitize。
// 文件可能由 AI 写入，渲染前剥离 script/iframe 等元素、on* 事件属性与
// javascript: 链接，防止面板页内脚本执行（面板可访问 boot token）。
function sanitizeDom(root) {
  root.querySelectorAll('script,iframe,object,embed,form,link,meta,style').forEach((el) => el.remove());
  root.querySelectorAll('*').forEach((el) => {
    for (const attr of Array.from(el.attributes)) {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) el.removeAttribute(attr.name);
      else if ((name === 'href' || name === 'src' || name === 'xlink:href')
               && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
    }
  });
}

function renderMarkdown(tab) {
  viewEl.innerHTML = '';
  if (tab._view) { tab._view.destroy(); tab._view = null; }
  const body = document.createElement('div');
  body.className = 'md-body';
  try {
    body.innerHTML = MarkedLib.marked.parse(tab.text || '');
  } catch (err) {
    body.textContent = tab.text || '';
  }
  sanitizeDom(body);
  // 点击渲染视图任意位置进入编辑模式（Typora 语义）
  body.addEventListener('click', (e) => {
    // 链接点击正常跳转，不触发编辑
    if (e.target.closest('a')) return;
    setTabMode(tab, 'edit');
    // 进入编辑后立即获得焦点，让光标落在点击位置附近
    requestAnimationFrame(() => {
      if (tab._view) tab._view.focus();
    });
  });
  viewEl.appendChild(body);
  applyScrollFraction(viewEl, tab.scroll || 0);
}

function setTabMode(tab, mode) {
  if (tab.mode === mode) return;
  // 编辑 → 渲染：文本已由 docChanged 同步到 tab.text，无需额外保存。
  tab.mode = mode;
  stashScroll();
  renderFileTab(tab);
  renderStatusbar();
}

async function saveTab(tab) {
  if (tab.kind !== 'text' || !tab.dirty) return;
  try {
    await api('/plugins/ide/file?session_id=' + encodeURIComponent(SESSION_ID)
      + '&path=' + encodeURIComponent(tab.path), {
      method: 'PUT',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: tab.text,
    });
    tab.savedText = tab.text;
    tab.dirty = false;
    saveHint = '已保存';
  } catch (err) {
    saveHint = '保存失败：' + err.message;
  }
  renderTabs();
  renderStatusbar();
  updateSaveButton(tab);
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    const tab = findTab(activePath);
    if (tab && tab.kind === 'text') {
      e.preventDefault();
      saveTab(tab);
    }
  }
});

function renderStatusbar() {
  const tab = findTab(activePath);
  if (!tab || tab.path === TREE_TAB) {
    statusbarEl.innerHTML = '<div class="seg grow">' + (gitViewActive ? '源代码管理' : '工作区文件') + '</div>';
    barSaveBtn.classList.remove('show');
    return;
  }
  let hint = '';
  let hintClass = '';
  if (saveHint) {
    hint = saveHint;
    hintClass = saveHint.startsWith('保存失败') ? 'hint-error' : '';
    saveHint = '';   // 一次性
  } else if (tab.kind === 'diff') {
    hint = tab.note || '修改前后对比（逆推重建，仅供参考）';
    hintClass = 'hint-diff';
  } else if (tab.kind === 'gitdiff') {
    hint = tab.note || '工作区变更对比（git diff）';
    hintClass = 'hint-diff';
  } else if (tab.kind === 'text') {
    hint = tab.dirty ? '未保存 · Ctrl+S' : '已保存';
    hintClass = tab.dirty ? 'hint-dirty' : '';
  }
  const isMd = tab.kind === 'text' && isMarkdown(tab.path);
  // [AutoC 2026-08-24] Typora 式焦点切换：渲染视图点击进入编辑，编辑器
  // 失焦切回渲染，状态栏不再放切换分栏。渲染态提示放在 hint 之后。
  const mdHint = (isMd && tab.mode === 'render')
    ? '<div class="seg">点击进入编辑</div>'
    : '';
  const indentSeg = (tab.kind === 'text' && (!isMd || tab.mode === 'edit'))
    ? '<div class="seg clickable" id="sb-indent" title="Tab 缩进宽度，点击在 2/4/8 间切换">缩进: ' + indentWidth + '</div>'
    : '';
  statusbarEl.innerHTML = '<div class="seg grow">' + esc(tab.path) + '</div>'
    + (hint ? '<div class="seg ' + hintClass + '">' + esc(hint) + '</div>' : '')
    + mdHint + indentSeg;
  const ibtn = document.getElementById('sb-indent');
  if (ibtn) ibtn.addEventListener('click', cycleIndent);
  updateSaveButton(tab);
}

// 标签栏右端常驻保存按钮：仅文本标签页时显示，脏状态点亮
const barSaveBtn = document.getElementById('bar-save');
barSaveBtn.addEventListener('click', () => {
  const tab = findTab(activePath);
  if (tab && tab.kind === 'text') saveTab(tab);
});

const barSaveDot = barSaveBtn.querySelector('.dirty-dot');

function updateSaveButton(tab) {
  // 渲染模式的 MD 标签页不可编辑，无保存需求，隐藏按钮。
  if (!tab || tab.kind !== 'text' || (isMarkdown(tab.path) && tab.mode === 'render')) {
    barSaveBtn.classList.remove('show');
    return;
  }
  barSaveBtn.classList.add('show');
  barSaveBtn.disabled = !tab.dirty;
  barSaveDot.style.display = tab.dirty ? '' : 'none';
}

function cycleIndent() {
  const idx = INDENT_STEPS.indexOf(indentWidth);
  indentWidth = INDENT_STEPS[(idx + 1) % INDENT_STEPS.length];
  try { localStorage.setItem(LS_INDENT, String(indentWidth)); } catch (e) {}
  // 重建当前激活的文本编辑器（保留文档内容与滚动位置）；其他标签页在
  // 下次激活时经 renderEditor 读取新偏好。
  const tab = findTab(activePath);
  if (tab && tab.kind === 'text' && !(isMarkdown(tab.path) && tab.mode === 'render')) {
    tab.text = tab._view ? tab._view.state.doc.toString() : tab.text;
    if (tab._view) {
      tab.scroll = scrollFraction(tab._view.scrollDOM);
      tab.cursor = tab._view.state.selection.main.head;
    }
    tab._view = null;
    renderFileTab(tab);
  }
  renderStatusbar();
}

// ── file tree ────────────────────────────────────────────────────────────

async function fetchTree(subPath) {
  const params = new URLSearchParams();
  if (SESSION_ID) params.set('session_id', SESSION_ID);
  if (subPath) params.set('sub_path', subPath);
  params.set('depth', '2');
  const resp = await api('/workspace/tree?' + params);
  return resp.json();
}

function renderNode(node, depth, container) {
  const isDir = node.type === 'directory';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'node';
  btn.style.paddingLeft = (depth * 14 + 10) + 'px';
  btn.title = node.path;
  const badge = node.truncated ? ' (' + (node.childDirs || 0) + 'd ' + (node.childFiles || 0) + 'f)' : '';
  btn.innerHTML =
    '<span class="tw">' + (isDir ? '▸' : '') + '</span>' +
    '<span class="nm">' + esc(node.name) + (badge ? '<span style="color:var(--tertiary)">' + esc(badge) + '</span>' : '') + '</span>' +
    (isDir ? '' : '<span class="sz">' + esc(fmtSize(node.size)) + '</span>');
  container.appendChild(btn);

  const childBox = document.createElement('div');
  childBox.style.display = 'none';
  container.appendChild(childBox);

  let loaded = false;
  let expanded = false;

  function setExpanded(next) {
    expanded = next;
    childBox.style.display = expanded ? '' : 'none';
    btn.querySelector('.tw').textContent = isDir ? (expanded ? '▾' : '▸') : '';
  }

  btn.addEventListener('click', async () => {
    if (!isDir) {
      treeRootEl.querySelectorAll('.node.active').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');
      openFileTab(node.path, false);
      return;
    }
    if (expanded) { setExpanded(false); return; }
    if (!loaded) {
      loaded = true;
      let children = node.children || [];
      if (node.truncated || children.length === 0) {
        try {
          const data = await fetchTree(node.path === '.' ? '' : node.path);
          children = (data.tree && data.tree.children) || [];
        } catch (e) {
          children = [];
        }
      }
      childBox.innerHTML = '';
      children.forEach((c) => renderNode(c, depth + 1, childBox));
      if (children.length === 0) {
        childBox.innerHTML = '<div class="status">空目录</div>';
      }
    }
    setExpanded(true);
  });

  btn.addEventListener('dblclick', () => {
    if (!isDir) openFileTab(node.path, true);
  });
}

// ── git ─────────────────────────────────────────────────────────────────
// 入口是文件树路径栏右侧的分支按钮（buildGitButton，bootTree 时挂载）。
// 点击展开下拉浮层：分支名 + 刷新按钮 + 变更文件列表。列表项点击经
// openDiffTab 打开该文件的 unified diff 对比标签（kind:'gitdiff'，复用
// renderDiff 的红绿对比渲染）。非 git 仓库时徽章不显示，浮层内显示提示。

const GIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 9v6"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>';

let gitState = { is_repo: false, branch: '', changes: [], ahead: 0, behind: 0, unpushed: [] };
let gitPopEl = null;
let gitBadgeEl = null;
// 整页 Git 视图的激活状态：gitViewActive 为 true 时 renderView 渲染 Git 页
// 而不是文件树/文件内容。gitTreeBackup 暂存文件树 DOM，返回时恢复。
let gitViewActive = false;
let gitTreeBackup = null;
let gitLogCache = null;
let gitCommitMsg = '';

async function fetchGitStatus() {
  const resp = await api('/plugins/ide/git/status?session_id=' + encodeURIComponent(SESSION_ID));
  return resp.json();
}

async function refreshGit() {
  try {
    gitState = await fetchGitStatus();
  } catch {
    gitState = { is_repo: false, branch: '', changes: [], ahead: 0, behind: 0, unpushed: [] };
  }
  updateGitBadge();
  if (gitPopEl) renderGitPop();
  if (gitViewActive) renderGitView();
}

function updateGitBadge() {
  if (!gitBadgeEl) return;
  // 工作区变更 + 未推送提交都是用户关心的“变更”
  const n = gitState.is_repo ? gitState.changes.length + (gitState.ahead || 0) : 0;
  if (n > 0) {
    gitBadgeEl.textContent = n > 99 ? '99+' : String(n);
    gitBadgeEl.style.display = '';
  } else {
    gitBadgeEl.style.display = 'none';
  }
}

function buildGitButton() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'git-btn';
  btn.title = '源代码管理';
  btn.innerHTML = GIT_ICON + '<span class="git-badge" style="display:none"></span>';
  gitBadgeEl = btn.querySelector('.git-badge');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    // 整页 Git 视图：替换文件树显示，右上角返回
    openGitView();
  });
  // 首次构造时拉一次 status 填徽章
  void refreshGit();
  return btn;
}

function openGitPop(anchorBtn) {
  closeGitPop();
  const pop = document.createElement('div');
  pop.className = 'git-pop';
  gitPopEl = pop;
  anchorBtn.parentElement.appendChild(pop);
  renderGitPop();
  const onDocDown = (ev) => {
    if (!gitPopEl) return;
    if (gitPopEl.contains(ev.target) || anchorBtn.contains(ev.target)) return;
    closeGitPop();
  };
  // 延迟一帧挂监听，避免本次点击立即触发关闭
  setTimeout(() => document.addEventListener('pointerdown', onDocDown), 0);
  pop._onDocDown = onDocDown;
}

function closeGitPop() {
  if (!gitPopEl) return;
  if (gitPopEl._onDocDown) document.removeEventListener('pointerdown', gitPopEl._onDocDown);
  gitPopEl.remove();
  gitPopEl = null;
}

function renderGitPop() {
  const pop = gitPopEl;
  if (!pop) return;
  pop.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'git-pop-head';
  const branch = document.createElement('span');
  branch.className = 'branch';
  branch.textContent = gitState.is_repo ? gitState.branch : '源代码管理';
  head.appendChild(branch);
  const refresh = document.createElement('button');
  refresh.type = 'button';
  refresh.title = '刷新';
  refresh.textContent = '↻';
  refresh.addEventListener('click', (e) => { e.stopPropagation(); void refreshGit(); });
  head.appendChild(refresh);
  pop.appendChild(head);

  const body = document.createElement('div');
  body.className = 'git-pop-body';
  if (!gitState.is_repo) {
    body.innerHTML = '<div class="git-pop-empty">当前工作区不是 git 仓库</div>';
  } else if (gitState.changes.length === 0) {
    body.innerHTML = '<div class="git-pop-empty">没有变更</div>';
  } else {
    for (const ch of gitState.changes) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'git-row';
      row.title = ch.path;
      const st = document.createElement('span');
      st.className = 'st ' + ch.status + (ch.staged ? ' staged' : '');
      st.textContent = ch.status;
      st.title = ch.staged ? '已暂存' : '未暂存';
      row.appendChild(st);
      const p = document.createElement('span');
      p.className = 'p';
      p.textContent = ch.path;
      row.appendChild(p);
      row.addEventListener('click', () => {
        closeGitPop();
        void openGitDiffTab(ch.path);
      });
      body.appendChild(row);
    }
  }
  pop.appendChild(body);
}

async function openGitDiffTab(relPath) {
  const key = relPath + ' (diff)';
  let tab = findTab(key);
  if (!tab) {
    tab = newDiffTab(key, []);
    tab.kind = 'gitdiff';
    tabs.push(tab);
  }
  activePath = key;
  renderTabs();
  renderView();
  // 加载 unified diff 并解析为 renderDiff 的 {search, replace} 结构
  tab.loaded = false;
  let diffText = '';
  try {
    const resp = await api('/plugins/ide/git/diff?session_id=' + encodeURIComponent(SESSION_ID)
      + '&path=' + encodeURIComponent(relPath));
    const data = await resp.json();
    diffText = data.diff || '';
  } catch (err) {
    tab.note = '加载 diff 失败：' + err.message;
    tab.kind = 'binary';
    tab.loaded = true;
    if (activePath === key) { renderFileTab(tab); renderStatusbar(); }
    return;
  }
  const parsed = parseUnifiedDiff(diffText);
  tab.text = parsed.before;
  tab.afterText = parsed.after;
  tab.loaded = true;
  if (activePath === key) { renderFileTab(tab); renderStatusbar(); }
}

// 解析 unified diff 为整块 before/after 文本，复用 renderDiff 的行级对比。
// 只处理常规 @@ 块；多文件 diff 只取第一个文件（git diff -- <path> 只会有一个）。
function parseUnifiedDiff(text) {
  const before = [];
  const after = [];
  let inHunk = false;
  for (const line of text.split('\n')) {
    if (line.startsWith('@@')) { inHunk = true; continue; }
    if (!inHunk) continue;
    if (line.startsWith('diff --git')) break;
    if (line.startsWith('---') || line.startsWith('+++')) continue;
    if (line.startsWith('\\')) continue; // "No newline at end of file"
    if (line.startsWith('-')) { before.push(line.slice(1)); continue; }
    if (line.startsWith('+')) { after.push(line.slice(1)); continue; }
    // 上下文行同时进两侧
    const body = line.startsWith(' ') ? line.slice(1) : line;
    before.push(body);
    after.push(body);
  }
  return { before: before.join('\n'), after: after.join('\n') };
}

// ── 整页 Git 视图 ─────────────────────────────────────────────────────
// 点击文件树 git 按钮后，视图区整体切换为 Git 页（提交区 + 变更列表 +
// 提交记录时间轴），右上角返回文件树。文件树 DOM 由 gitTreeBackup 暂存，
// 返回时原样恢复，树的展开状态不丢。

async function openGitView() {
  if (activePath !== TREE_TAB) {
    // 从文件标签进入：先切回文件树标签，再替换视图
    activePath = TREE_TAB;
    renderTabs();
  }
  if (!gitViewActive) {
    gitTreeBackup = viewEl.firstChild;
    gitViewActive = true;
  }
  closeGitPop();
  // 并行拉 status 和 log
  void refreshGit();
  void loadGitLog();
  renderGitView();
  renderStatusbar();
}

function closeGitView() {
  gitViewActive = false;
  gitLogCache = null;
  if (activePath === TREE_TAB) {
    renderView();
    renderStatusbar();
  }
}

async function loadGitLog() {
  try {
    const resp = await api('/plugins/ide/git/log?session_id=' + encodeURIComponent(SESSION_ID));
    gitLogCache = await resp.json();
  } catch {
    gitLogCache = { is_repo: false, commits: [] };
  }
  if (gitViewActive) renderGitView();
}

function relTime(ts) {
  const diff = Math.floor(Date.now() / 1000) - ts;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function renderGitView() {
  viewEl.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'git-page';

  // ── 顶行：返回 + 分支名 + 刷新 ──
  const top = document.createElement('div');
  top.className = 'git-page-top';
  const back = document.createElement('button');
  back.type = 'button';
  back.className = 'git-back';
  back.textContent = '← 返回';
  back.addEventListener('click', closeGitView);
  top.appendChild(back);
  const branch = document.createElement('span');
  branch.className = 'git-page-branch';
  branch.textContent = gitState.is_repo
    ? gitState.branch + (gitState.ahead > 0 ? ' ↑' + gitState.ahead : '') + (gitState.behind > 0 ? ' ↓' + gitState.behind : '')
    : '';
  top.appendChild(branch);
  const refresh = document.createElement('button');
  refresh.type = 'button';
  refresh.className = 'git-iconbtn';
  refresh.title = '刷新';
  refresh.textContent = '↻';
  refresh.addEventListener('click', () => { void refreshGit(); void loadGitLog(); });
  top.appendChild(refresh);
  page.appendChild(top);

  if (!gitState.is_repo) {
    const empty = document.createElement('div');
    empty.className = 'status';
    empty.textContent = '当前工作区不是 git 仓库';
    page.appendChild(empty);
    viewEl.appendChild(page);
    return;
  }

  // ── 提交区 ──
  const commitBox = document.createElement('div');
  commitBox.className = 'git-commit';
  const ta = document.createElement('textarea');
  ta.className = 'git-commit-msg';
  ta.placeholder = '提交信息';
  ta.value = gitCommitMsg;
  ta.rows = 2;
  ta.addEventListener('input', () => { gitCommitMsg = ta.value; });
  commitBox.appendChild(ta);
  const commitBtn = document.createElement('button');
  commitBtn.type = 'button';
  commitBtn.className = 'git-commit-btn';
  const stagedCount = gitState.changes.filter(c => c.staged).length;
  commitBtn.textContent = stagedCount > 0 ? '提交（' + stagedCount + ' 项已暂存）' : '提交';
  commitBtn.disabled = stagedCount === 0;
  commitBtn.addEventListener('click', async () => {
    const msg = gitCommitMsg.trim();
    if (!msg) { ta.focus(); return; }
    commitBtn.disabled = true;
    commitBtn.textContent = '提交中…';
    try {
      const resp = await api('/plugins/ide/git/commit?session_id=' + encodeURIComponent(SESSION_ID), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: msg,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || '提交失败');
      gitCommitMsg = '';
      void refreshGit();
      void loadGitLog();
    } catch (err) {
      alert('提交失败：' + err.message);
      commitBtn.disabled = false;
      commitBtn.textContent = '提交';
    }
  });
  commitBox.appendChild(commitBtn);
  page.appendChild(commitBox);

  // ── 变更列表：暂存的变更 / 变更 两个分组 ──
  const staged = gitState.changes.filter(c => c.staged);
  const unstaged = gitState.changes.filter(c => !c.staged);
  const mkGroup = (title, items, actionLabel, actionFn) => {
    if (!items.length) return;
    const g = document.createElement('div');
    g.className = 'git-group';
    const gh = document.createElement('div');
    gh.className = 'git-group-head';
    gh.textContent = title + '（' + items.length + '）';
    g.appendChild(gh);
    for (const ch of items) {
      const row = document.createElement('div');
      row.className = 'git-page-row';
      const st = document.createElement('span');
      st.className = 'st ' + ch.status;
      st.textContent = ch.status;
      row.appendChild(st);
      const p = document.createElement('span');
      p.className = 'p';
      p.textContent = ch.path;
      p.title = ch.path;
      row.appendChild(p);
      const act = document.createElement('button');
      act.type = 'button';
      act.className = 'git-row-act';
      act.textContent = actionLabel;
      act.title = actionLabel === '+' ? '暂存' : '取消暂存';
      act.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          await api('/plugins/ide/git/' + actionFn + '?session_id=' + encodeURIComponent(SESSION_ID)
            + '&path=' + encodeURIComponent(ch.path), { method: 'POST' });
          void refreshGit();
        } catch (err) {
          alert('操作失败：' + err.message);
        }
      });
      row.appendChild(act);
      p.addEventListener('click', () => { void openGitDiffTab(ch.path); });
      p.style.cursor = 'pointer';
      g.appendChild(row);
    }
    page.appendChild(g);
  };
  mkGroup('暂存的变更', staged, '−', 'unstage');
  mkGroup('变更', unstaged, '+', 'stage');
  if (!staged.length && !unstaged.length) {
    const none = document.createElement('div');
    none.className = 'git-pop-empty';
    none.textContent = '没有变更';
    page.appendChild(none);
  }

  // ── 未推送的提交（与远程的差异）──
  if (gitState.ahead > 0 && gitState.unpushed && gitState.unpushed.length) {
    const upGroup = document.createElement('div');
    upGroup.className = 'git-group';
    const uh = document.createElement('div');
    uh.className = 'git-group-head';
    uh.textContent = '未推送的提交（' + gitState.ahead + '）';
    upGroup.appendChild(uh);
    for (const c of gitState.unpushed) {
      const row = document.createElement('div');
      row.className = 'git-log-row';
      row.innerHTML = '<code class="git-log-hash">' + esc(c.hash) + '</code>'
        + '<span class="git-log-msg">' + esc(c.subject) + '</span>'
        + '<span class="git-log-time">' + esc(relTime(c.time)) + '</span>';
      row.title = c.author + ' · ' + new Date(c.time * 1000).toLocaleString();
      upGroup.appendChild(row);
    }
    if (gitState.ahead > gitState.unpushed.length) {
      const more = document.createElement('div');
      more.className = 'git-pop-empty';
      more.textContent = '…另有 ' + (gitState.ahead - gitState.unpushed.length) + ' 条未显示';
      upGroup.appendChild(more);
    }
    page.appendChild(upGroup);
  }

  // ── 提交记录时间轴 ──
  if (gitLogCache && gitLogCache.is_repo && gitLogCache.commits.length) {
    const logGroup = document.createElement('div');
    logGroup.className = 'git-group';
    const lh = document.createElement('div');
    lh.className = 'git-group-head';
    lh.textContent = '提交记录';
    logGroup.appendChild(lh);
    for (const c of gitLogCache.commits) {
      const row = document.createElement('div');
      row.className = 'git-log-row';
      row.innerHTML = '<code class="git-log-hash">' + esc(c.hash) + '</code>'
        + '<span class="git-log-msg">' + esc(c.subject) + '</span>'
        + '<span class="git-log-time">' + esc(relTime(c.time)) + '</span>';
      row.title = c.author + ' · ' + new Date(c.time * 1000).toLocaleString();
      logGroup.appendChild(row);
    }
    page.appendChild(logGroup);
  }

  viewEl.appendChild(page);
}

async function bootTree() {
  if (!SESSION_ID) {
    if (activePath === TREE_TAB) viewEl.innerHTML = '<div class="status">缺少会话上下文</div>';
    return;
  }
  if (activePath === TREE_TAB) viewEl.innerHTML = '<div class="status">加载中…</div>';
  try {
    const data = await fetchTree('');
    treeRootEl = document.createElement('div');
    treeRootEl.className = 'tree-root';
    if (data.workspace_path) {
      const p = document.createElement('div');
      p.className = 'tree-path';
      const ws = document.createElement('span');
      ws.className = 'ws';
      ws.textContent = data.workspace_path;
      ws.title = data.workspace_path;
      p.appendChild(ws);
      p.appendChild(buildGitButton());
      treeRootEl.appendChild(p);
    }
    const children = (data.tree && data.tree.children) || [];
    if (children.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'status';
      empty.textContent = '空目录或未设置工作区';
      treeRootEl.appendChild(empty);
    } else {
      children.forEach((c) => renderNode(c, 0, treeRootEl));
    }
    treeBooted = true;
    // [AutoC 2026-08-26] 竞态修复：bootTree 与 loadFileTab 并发时，树请求
    // 后完成会无条件把树塞进 viewEl，覆盖已激活的文件标签视图（首次点击
    // “在 IDE 打开”只出标签不跳转的根因）。只在当前仍是文件树标签时才渲染，
    // 否则只缓存树数据，切回文件树时由 renderView 正常挂载。
    if (activePath === TREE_TAB) {
      viewEl.innerHTML = '';
      viewEl.appendChild(treeRootEl);
    }
  } catch (err) {
    if (activePath === TREE_TAB) viewEl.innerHTML = '<div class="status">加载失败：' + esc(err.message) + '</div>';
  }
}

// ── file loading & classification ────────────────────────────────────────

async function loadFileTab(tab) {
  const seq = ++loadSeq;
  showStatus('加载中…');
  renderStatusbar();
  let resp;
  try {
    resp = await api('/sessions/' + encodeURIComponent(SESSION_ID)
      + '/file?path=' + encodeURIComponent(tab.path));
  } catch (err) {
    if (activePath === tab.path) showStatus('加载失败：' + err.message);
    return;
  }
  const ct = resp.headers.get('content-type') || '';
  const ext = extOf(tab.path);
  if (ct.startsWith('image/') || IMAGE_EXTS.has(ext)) {
    const blob = await resp.blob();
    tab.kind = 'image';
    tab.blobUrl = URL.createObjectURL(blob);
  } else {
    const buf = await resp.arrayBuffer();
    if (buf.byteLength > MAX_TEXT_BYTES * 4) {
      tab.kind = 'binary';
      tab.note = '二进制文件（' + buf.byteLength + ' B），不支持预览';
    } else {
      const bytes = new Uint8Array(buf);
      let isBinary = false;
      for (let i = 0; i < Math.min(bytes.length, 8192); i++) {
        if (bytes[i] === 0) { isBinary = true; break; }
      }
      if (isBinary) {
        tab.kind = 'binary';
        tab.note = '二进制文件（' + buf.byteLength + ' B），不支持预览';
      } else {
        let text = new TextDecoder('utf-8').decode(bytes);
        if (text.length > MAX_TEXT_BYTES) {
          text = text.slice(0, MAX_TEXT_BYTES);
          tab.note = '文件过大，仅加载前 ' + MAX_TEXT_BYTES + ' 字节，保存将被拒绝';
          tab.kind = 'binary';   // 截断内容不可写回，按只读处理
        } else {
          tab.kind = 'text';
          tab.text = text;
          tab.savedText = text;
        }
      }
    }
  }
  tab.loaded = true;
  // 仅当本次加载仍是最新且该标签仍激活时才渲染；过期的响应直接丢弃，
  // 内容已缓存进 tab，切回时直接命中。
  if (activePath === tab.path && seq === loadSeq) {
    renderFileTab(tab);
    renderStatusbar();
  }
}

async function loadDiffTab(tab) {
  const seq = ++loadSeq;
  showStatus('加载中…');
  renderStatusbar();
  // diff 标签的 path 带 ' (diff)' 后缀，取原始路径读文件
  const filePath = tab.path.replace(/ \(diff\)$/, '');
  let resp;
  try {
    resp = await api('/sessions/' + encodeURIComponent(SESSION_ID)
      + '/file?path=' + encodeURIComponent(filePath));
  } catch (err) {
    if (activePath === tab.path) showStatus('加载失败：' + err.message);
    return;
  }
  const current = await resp.text();
  // 工具执行完后文件已是 after 态。逆应用 diffs（replace → search，倒序）
  // 得到 before 态。逆应用失败的条目说明文件状态与 diff 不匹配，此时
  // before = current（该条 diff 不体现在对比中）。
  let before = current;
  let unmatched = 0;
  const revDiffs = (tab.diffs || []).slice().reverse();
  for (const d of revDiffs) {
    const search = String(d.search || '');
    const replace = String(d.replace || '');
    if (replace && before.includes(replace)) {
      before = before.replace(replace, search);
    } else if (replace) {
      unmatched++;
    }
  }
  tab.text = before;        // 修改前
  tab.afterText = current;  // 修改后（当前文件）
  tab.loaded = true;
  if (unmatched > 0) tab.note = unmatched + ' 处 diff 无法逆向匹配';
  if (activePath === tab.path && seq === loadSeq) {
    renderFileTab(tab);
    renderStatusbar();
  }
}

function renderImage(tab) {
  viewEl.innerHTML = '';
  const img = document.createElement('img');
  img.className = 'pv-img';
  img.src = tab.blobUrl;
  img.alt = tab.path;
  viewEl.appendChild(img);
}

// ── panel-intent listener ──────────────────────────────────────────────────
// The host forwards the opaque open intent after the iframe loads. ide owns
// 'open-file' and 'open-diff'; other intents are ignored.
window.addEventListener('message', (ev) => {
  const data = ev && ev.data;
  if (!data || data.type !== 'clonoth:panel-intent') return;
  const intent = data.intent;
  if (!intent) return;
  if (intent.kind === 'open-file' && intent.path) {
    openFileTab(String(intent.path), false);
  } else if (intent.kind === 'open-diff' && intent.path && Array.isArray(intent.diffs)) {
    openDiffTab(String(intent.path), intent.diffs);
  }
});
// 通知宿主：监听器已就绪，可以重发 intent。解决首次点击只初始化不跳转。
window.parent.postMessage({ type: 'clonoth:panel-ready' }, window.location.origin);

// ── boot ─────────────────────────────────────────────────────────────────

renderTabs();
renderView();
</script>
</body>
</html>
