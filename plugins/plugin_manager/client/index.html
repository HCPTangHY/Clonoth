<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  /* 主题变量引用宿主注入的计算值（themeBridge.ts 在 iframe load 后写入 --duties-*）。
     回退值仅保证注入前可读；任何宿主主题变更或插件 styles 覆写都会随注入自动跟随。
     --ok/--danger 是页面局部语义色，不属于宿主主题，保持本地定义。 */
  :root {
    --bg: var(--duties-bg, #f1f0ee); --panel: var(--duties-panel, #e8e7e5); --muted: var(--duties-muted, #dddcda);
    --text: var(--duties-text, #252525); --secondary: var(--duties-secondary, #4a4a4a); --tertiary: var(--duties-tertiary, #6e6e73);
    --border: var(--duties-border, #ccc); --accent: var(--duties-accent, #feaf2c);
    --ok: #2e7d32; --danger: #a33c3c;
    --mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-color: var(--duties-scrollbar-thumb, #ccc) var(--duties-scrollbar-track, transparent); scrollbar-width: thin; }
  *::-webkit-scrollbar { width: 0.45rem; height: 0.45rem; }
  *::-webkit-scrollbar-track { background: var(--duties-scrollbar-track, transparent); }
  *::-webkit-scrollbar-thumb { background: var(--duties-scrollbar-thumb, #ccc); border: 0.125rem solid transparent; border-radius: 999px; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--duties-scrollbar-thumb-hover, #4a4a4a); background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }
  body {
    font: 12px/1.6 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px 24px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  h1 { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: -0.02em; }
  .hint { color: var(--tertiary); font-size: 10.5px; max-width: 560px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--muted); vertical-align: top; }
  th { color: var(--tertiary); font-weight: 500; font-size: 10.5px; font-family: var(--mono); }
  tr.mainrow { cursor: pointer; }
  tr.mainrow:hover { background: var(--panel); }
  td.name { font-family: var(--mono); font-weight: 600; font-size: 11.5px; }
  .entryfile { color: var(--tertiary); font-weight: 400; font-size: 10px; }
  td.desc { color: var(--secondary); font-size: 11.5px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    display: inline-block; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 9.5px; font-family: var(--mono); margin-right: 4px; color: var(--tertiary);
    background: var(--panel); line-height: 15px;
  }
  .tag.on { color: var(--ok); border-color: var(--ok); background: transparent; }
  .tag.off { color: var(--danger); border-color: var(--danger); background: transparent; }
  .tag.builtin { color: var(--accent); border-color: var(--accent); background: transparent; }
  button {
    font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 2px 8px;
    background: transparent; color: var(--secondary);
    border: 1px solid var(--border); border-radius: 3px; margin-right: 4px;
    transition: border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  button:disabled { opacity: .3; cursor: not-allowed; }
  button.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
  tr.detail td {
    background: var(--panel); border-bottom: 1px solid var(--muted); padding: 8px 10px 10px;
  }
  .meta-grid { display: grid; grid-template-columns: 72px 1fr; row-gap: 3px; font-size: 10.5px; }
  .meta-grid dt { color: var(--tertiary); font-family: var(--mono); }
  .meta-grid dd { color: var(--secondary); font-family: var(--mono); word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  #msg { margin-top: 10px; font-size: 10.5px; color: var(--tertiary); font-family: var(--mono); min-height: 15px; }
  #msg.err { color: var(--danger); }
  .empty { color: var(--tertiary); padding: 28px 0; text-align: center; font-size: 11.5px; }
  .caret { color: var(--tertiary); display: inline-block; width: 12px; transition: transform .15s; font-size: 9px; }
  tr.open .caret { transform: rotate(90deg); }
</style>
</head>
<body>
<header>
  <h1>插件管理</h1>
  <span class="hint">外部插件支持运行时装卸与启停；builtin 属 engine 进程，仅展示。<br>
  「未加载」= 已启用但不在运行中的注册表（重启后新增的文件，或启动时加载失败）。点击条目行展开插件元数据。<button id="refresh" style="margin-left:6px">刷新</button></span>
</header>
<div id="table"></div>
<div id="msg"></div>
<script>
'use strict';

function boot() {
  try {
    const b = window.parent.__CLONOTH_BOOT__;
    if (b && b.token) return b;
  } catch (e) { /* cross-origin fallback below */ }
  return { token: '' };
}

async function api(path, init) {
  const b = boot();
  const resp = await fetch('/v1' + path, {
    ...init,
    headers: {
      'Content-Type': 'application/json',
      ...(b.token ? { Authorization: 'Bearer ' + b.token } : {}),
      ...((init && init.headers) || {}),
    },
  });
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).detail || ''; } catch (e) {}
    throw new Error(resp.status + (detail ? ' ' + detail : ''));
  }
  return resp.json();
}

function say(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : '';
}

const expanded = new Set();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function chips(items, limit) {
  const list = (items || []).slice(0, limit);
  const rest = (items || []).length - list.length;
  return list.map(x => '<span class="tag">' + esc(x) + '</span>').join('')
    + (rest > 0 ? '<span class="tag">+' + rest + '</span>' : '');
}

function buttons(p) {
  if (p.builtin) return '';
  const parts = [];
  if (p.loaded) {
    parts.push('<button data-op="unload" data-entry="' + esc(p.entry) + '">卸载</button>');
    parts.push('<button data-op="load" data-entry="' + esc(p.entry) + '">重载</button>');
  } else if (p.enabled) {
    parts.push('<button data-op="load" data-entry="' + esc(p.entry) + '">加载</button>');
  } else {
    parts.push('<button data-op="enable" data-entry="' + esc(p.entry) + '">启用</button>');
  }
  if (p.enabled && p.entry !== 'plugin_manager') {
    parts.push('<button class="danger" data-op="disable" data-entry="' + esc(p.entry) + '">停用</button>');
  }
  return parts.join('');
}

function row(p, meta) {
  const tags = [];
  if (p.builtin) tags.push('<span class="tag builtin">builtin</span>');
  else {
    tags.push(p.loaded ? '<span class="tag on">已加载</span>' : '<span class="tag">未加载</span>');
    tags.push(p.enabled ? '<span class="tag on">已启用</span>' : '<span class="tag off">已停用</span>');
    tags.push('<span class="tag">' + esc(p.kind) + '</span>');
  }
  const title = p.name || p.entry;
  const ver = meta && meta.version ? ' ' + meta.version : (p.version ? ' ' + p.version : '');
  const entryFile = p.builtin ? '' : '<div class="entryfile">' + esc(p.file_name) + '</div>';
  const isOpen = expanded.has(p.builtin ? 'b:' + p.name : p.entry);
  let main = '<tr class="mainrow' + (isOpen ? ' open' : '') + '" data-expand="' + esc(p.builtin ? 'b:' + p.name : p.entry) + '">'
    + '<td class="name"><span class="caret">' + (p.builtin ? '' : '▶') + '</span>' + esc(title) + esc(ver)
    + '<div style="margin-top:3px">' + tags.join('') + '</div>' + entryFile + '</td>'
    + '<td class="desc" title="' + esc(p.description || (meta && meta.description) || '') + '">'
    + esc(p.description || (meta && meta.description) || '') + '</td>'
    + '<td style="white-space:nowrap">' + buttons(p) + '</td></tr>';
  if (isOpen) {
    const client = meta && meta.client;
    const clientBits = [];
    if (client && Array.isArray(client.panels)) clientBits.push('panels×' + client.panels.length);
    if (client && Array.isArray(client.slots)) clientBits.push('slots×' + client.slots.length);
    if (client && client.styles) clientBits.push('styles');
    main += '<tr class="detail open"><td colspan="3"><dl class="meta-grid">'
      + '<dt>名称</dt><dd>' + esc(title) + (ver ? esc(ver) : '') + '</dd>'
      + (meta && meta.author ? '<dt>作者</dt><dd>' + esc(meta.author) + '</dd>' : '')
      + (meta && meta.module ? '<dt>模块</dt><dd>' + esc(meta.module) + '</dd>' : '')
      + (meta && meta.hooks && meta.hooks.length
          ? '<dt>hooks</dt><dd class="chips">' + chips(meta.hooks, 12) + '</dd>' : '')
      + (meta && meta.tools && meta.tools.length
          ? '<dt>tools</dt><dd class="chips">' + chips(meta.tools.map(t => typeof t === 'string' ? t : t.name), 12) + '</dd>' : '')
      + (meta && meta.routes && meta.routes.length
          ? '<dt>routes</dt><dd class="chips">'
            + chips(meta.routes.map(r => (r.method || 'GET') + ' ' + (r.path || r.prefix || '')), 8) + '</dd>' : '')
      + (clientBits.length ? '<dt>前端</dt><dd class="chips">' + chips(clientBits, 6) + '</dd>' : '')
      + '</dl></td></tr>';
  }
  return main;
}

async function refresh() {
  try {
    const [data, registry] = await Promise.all([
      api('/plugins/plugin_manager/list'),
      api('/plugins').catch(() => ({ plugins: [] })),
    ]);
    const metaByName = {};
    for (const rp of registry.plugins || []) metaByName[rp.name] = rp;
    const rows = (data.plugins || []).map(p => row(p, p.name ? metaByName[p.name] : undefined)).join('');
    document.getElementById('table').innerHTML = rows
      ? '<table><tr><th style="width:36%">插件</th><th>描述</th><th style="width:160px">操作</th></tr>' + rows + '</table>'
      : '<div class="empty">plugins/ 目录为空，尚无外部插件</div>';
    say('共 ' + (data.plugins || []).length + ' 项 · ' + new Date().toLocaleTimeString());
  } catch (err) {
    document.getElementById('table').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    say('列表获取失败：' + err.message, true);
  }
}

document.addEventListener('click', async (ev) => {
  const mainrow = ev.target.closest('tr.mainrow');
  if (mainrow && !ev.target.closest('button')) {
    const key = mainrow.dataset.expand;
    expanded.has(key) ? expanded.delete(key) : expanded.add(key);
    refresh();
    return;
  }
  const btn = ev.target.closest('button[data-op]');
  if (!btn) return;
  btn.disabled = true;
  try {
    await api('/plugins/plugin_manager/' + btn.dataset.entry + '/' + btn.dataset.op, { method: 'POST' });
    say(btn.dataset.entry + ' ' + btn.dataset.op + ' 完成');
    await refresh();
  } catch (err) {
    say(err.message, true);
    btn.disabled = false;
  }
});

document.getElementById('refresh').addEventListener('click', refresh);
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
