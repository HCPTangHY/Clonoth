<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  /* 主题值全部由宿主注入（themeBridge.ts 在 iframe load 后把 :root 规则文本
     原样写入本页）。本页只声明本地别名与宿主变量名的映射，不持有任何宿主值；
     注入完成前页面短暂无主题，属于可接受的加载瞬间。
     --ok/--danger/--warn 是本页局部语义色，与宿主主题无关，保持本地定义。 */
  :root {
    --bg: var(--duties-bg); --panel: var(--duties-panel); --muted: var(--duties-muted);
    --text: var(--duties-text); --secondary: var(--duties-secondary); --tertiary: var(--duties-tertiary);
    --border: var(--duties-border); --accent: var(--duties-accent);
    --ok: #2e7d32; --danger: #a33c3c; --warn: #b07a2a;
    --mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 12px/1.6 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* ── 顶部工具区（sticky） ─────────────────────────────── */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--muted);
    display: flex; flex-direction: column; gap: 8px;
  }
  .toolbar-top { display: flex; align-items: baseline; gap: 12px; }
  .toolbar-top h1 { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: -0.02em; }
  .stats { color: var(--tertiary); font-size: 10.5px; font-family: var(--mono); flex: 1; min-width: 0;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats b { color: var(--secondary); font-weight: 600; }
  .toolbar-row2 { display: flex; gap: 8px; align-items: center; }
  .search {
    flex: 0 0 220px; font: 11px var(--mono); color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; outline: none;
  }
  .search:focus { border-color: var(--secondary); }
  .search::placeholder { color: var(--tertiary); }
  .filters { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    font: 10px var(--mono); white-space: nowrap; cursor: pointer;
    color: var(--tertiary); background: transparent;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 9px; transition: color .15s, border-color .15s;
  }
  .chip:hover { color: var(--secondary); border-color: var(--secondary); }
  .chip.active { color: var(--accent); border-color: var(--accent); }
  .chip .n { opacity: .65; margin-left: 2px; }

  /* ── 通用按钮 ─────────────────────────────────────────── */
  button.op {
    font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 3px 9px;
    background: transparent; color: var(--secondary);
    border: 1px solid var(--border); border-radius: 3px;
    transition: border-color .15s, color .15s;
  }
  button.op:hover:not(:disabled) { color: var(--text); border-color: var(--text); }
  button.op:disabled { opacity: .3; cursor: not-allowed; }
  button.op.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
  button.op.armed { color: var(--danger); border-color: var(--danger); font-weight: 600; }

  /* ── 列表 ─────────────────────────────────────────────── */
  .list { padding: 12px 20px 24px; }
  .section-head {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    color: var(--tertiary); font: 10.5px var(--mono); padding: 10px 0 6px;
  }
  .section-head:hover { color: var(--secondary); }
  .section-head .cnt { opacity: .7; }
  .section-head .tw { display: inline-block; transition: transform .15s; font-size: 9px; }
  .section-head.open .tw { transform: rotate(90deg); }

  .card {
    position: relative; border: 1px solid var(--muted); border-radius: 4px;
    background: var(--bg); margin-bottom: 6px; overflow: hidden;
    transition: border-color .3s;
  }
  .card.flash { border-color: var(--accent); }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .card.st-run::before  { background: var(--ok); }
  .card.st-off::before  { background: var(--tertiary); }
  .card.st-wait::before { background: var(--warn); }
  .card.st-err::before  { background: var(--danger); }
  .card.st-builtin::before { background: var(--accent); }

  .card-main { padding: 8px 12px 8px 15px; cursor: pointer; }
  .card-main:hover { background: var(--panel); }
  .card-line1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pname { font-family: var(--mono); font-weight: 600; font-size: 11.5px; word-break: break-all; }
  .pver { font-family: var(--mono); font-size: 10px; color: var(--tertiary); }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge {
    display: inline-block; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px;
    font: 9.5px/15px var(--mono); color: var(--tertiary); background: var(--panel);
  }
  .badge.on  { color: var(--ok); border-color: var(--ok); background: transparent; }
  .badge.off { color: var(--danger); border-color: var(--danger); background: transparent; }
  .badge.builtin { color: var(--accent); border-color: var(--accent); background: transparent; }
  .badge.warn { color: var(--warn); border-color: var(--warn); background: transparent; }
  .card-line2 { color: var(--secondary); font-size: 11.5px; margin-top: 3px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-line3 { color: var(--tertiary); font: 10px var(--mono); margin-top: 3px; }
  .errline { color: var(--danger); font: 10px var(--mono); margin-top: 3px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-ops { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }
  .caret { color: var(--tertiary); font-size: 9px; transition: transform .15s; }
  .card.open .caret { transform: rotate(90deg); }

  /* ── 展开详情 ─────────────────────────────────────────── */
  .card-detail { display: none; border-top: 1px solid var(--muted); background: var(--panel); padding: 10px 14px 12px 15px; }
  .card.open .card-detail { display: block; }
  .meta-grid { display: grid; grid-template-columns: 64px 1fr; row-gap: 4px; font-size: 10.5px; }
  .meta-grid dt { color: var(--tertiary); font-family: var(--mono); padding-top: 1px; }
  .meta-grid dd { color: var(--secondary); font-family: var(--mono); word-break: break-all; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chips .badge { background: var(--bg); }
  .routes-more { font: 10px var(--mono); color: var(--accent); background: none; border: none;
                 cursor: pointer; padding: 0; margin-top: 2px; }
  .routes-more:hover { text-decoration: underline; }
  .errbox {
    margin-top: 8px; background: var(--bg); border: 1px solid var(--danger); border-radius: 3px;
    padding: 8px 10px; max-height: 180px; overflow: auto;
  }
  .errbox pre { font: 10px/1.5 var(--mono); color: var(--danger); white-space: pre-wrap; word-break: break-all; }
  .ops-mobile { display: none; }

  #msg { padding: 0 20px 14px; font: 10.5px var(--mono); color: var(--tertiary); min-height: 15px; }
  #msg.err { color: var(--danger); }
  .empty { color: var(--tertiary); padding: 36px 0; text-align: center; font-size: 11.5px; }

  /* ── 移动端（≤640px） ─────────────────────────────────── */
  @media (max-width: 640px) {
    .toolbar { padding: 12px 14px 8px; }
    .toolbar-top { flex-wrap: wrap; }
    .stats { white-space: normal; }
    .toolbar-row2 { flex-direction: column; align-items: stretch; }
    .search { flex: none; width: 100%; padding: 6px 10px; }
    .filters { padding-bottom: 2px; }
    .chip { padding: 3px 11px; font-size: 10.5px; }
    .list { padding: 8px 14px 20px; }
    .card-ops { display: none; }           /* 行内按钮退场 */
    .card-main { padding: 9px 12px 9px 15px; }
    .ops-mobile { display: grid; gap: 6px; margin-bottom: 4px; }
    .ops-mobile button.op { width: 100%; padding: 7px 0; font-size: 11px; }  /* 触控目标 */
    .meta-grid { grid-template-columns: 1fr; row-gap: 1px; }
    .meta-grid dt { padding-top: 6px; }
    .meta-grid dd { padding-bottom: 2px; }
    .card-line2 { white-space: normal; }
    #msg { padding: 0 14px 12px; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-top">
    <h1>插件管理</h1>
    <span class="stats" id="stats"></span>
    <button class="op" id="refresh">刷新</button>
  </div>
  <div class="toolbar-row2">
    <input class="search" id="search" type="text" placeholder="搜索名称 / 描述 / 文件名…" spellcheck="false">
    <div class="filters" id="filters"></div>
  </div>
</div>
<div class="list" id="list"></div>
<div id="msg"></div>
<script>
'use strict';

/* ── 基础设施 ──────────────────────────────────────────── */

function boot() {
  try {
    const b = window.parent.__CLONOTH_BOOT__;
    if (b && b.token) return b;
  } catch (e) { /* cross-origin fallback below */ }
  return { token: '' };
}

async function api(path, init) {
  const b = boot();
  const resp = await fetch('/v1' + path, {
    ...init,
    headers: {
      'Content-Type': 'application/json',
      ...(b.token ? { Authorization: 'Bearer ' + b.token } : {}),
      ...((init && init.headers) || {}),
    },
  });
  if (!resp.ok) {
    let detail = '';
    try { detail = (await resp.json()).detail || ''; } catch (e) {}
    throw new Error(resp.status + (detail ? ' ' + detail : ''));
  }
  return resp.json();
}

function say(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : '';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/* ── 状态 ──────────────────────────────────────────────── */

let allEntries = [];        // plugin_admin_list 的完整条目
let metaByName = {};        // /v1/plugins 注册表元数据，按 name 索引
let filter = 'all';         // all | running | disabled | unloaded | failed | builtin
let keyword = '';
let expanded = new Set();   // 展开的卡片 key（entry 或 b:name）
let builtinOpen = false;    // 内置插件分组默认折叠
let armed = null;           // 二次确认状态 {key, entry, op, html, deadline, timer}
let lastActionEntry = null; // 操作完成后高亮的 entry
let seq = 0;                // 异步渲染竞态防护

const FILTERS = [
  ['all', '全部'],
  ['running', '运行中'],
  ['disabled', '已停用'],
  ['unloaded', '未加载'],
  ['failed', '失败'],
  ['builtin', '内置'],
];

/* ── 分类与过滤 ────────────────────────────────────────── */

function stateOf(p) {
  if (p.builtin) return 'builtin';
  if (p.error) return 'failed';
  if (!p.enabled) return 'disabled';
  if (!p.loaded) return 'unloaded';
  return 'running';
}

function matchFilter(p) {
  if (filter === 'all') return true;
  return stateOf(p) === filter;
}

function matchKeyword(p) {
  if (!keyword) return true;
  const kw = keyword.toLowerCase();
  const hay = [p.name, p.entry, p.file_name, p.description, p.version]
    .map(x => String(x || '').toLowerCase()).join('\n');
  return hay.includes(kw);
}

function counts() {
  const c = { running: 0, disabled: 0, unloaded: 0, failed: 0, builtin: 0 };
  for (const p of allEntries) c[stateOf(p)]++;
  return c;
}

/* ── 渲染 ──────────────────────────────────────────────── */

function cardKey(p) { return p.builtin ? 'b:' + p.name : p.entry; }

function renderFilters() {
  const c = counts();
  const total = allEntries.length;
  document.getElementById('filters').innerHTML = FILTERS.map(([id, label]) => {
    const n = id === 'all' ? total : c[id];
    return '<button class="chip' + (filter === id ? ' active' : '') + '" data-filter="' + id + '">'
      + label + '<span class="n">' + n + '</span></button>';
  }).join('');
}

function renderStats() {
  const c = counts();
  document.getElementById('stats').innerHTML =
    '运行 <b>' + c.running + '</b> · 停用 <b>' + c.disabled + '</b>'
    + ' · 未加载 <b>' + c.unloaded + '</b> · 失败 <b>' + c.failed + '</b>'
    + ' · 内置 <b>' + c.builtin + '</b>';
}

function badgeHtml(p) {
  if (p.builtin) return '<span class="badge builtin">builtin</span>';
  const out = [];
  if (p.loaded) out.push('<span class="badge on">已加载</span>');
  else if (p.error) out.push('<span class="badge off">加载失败</span>');
  else out.push('<span class="badge warn">未加载</span>');
  out.push(p.enabled ? '<span class="badge on">已启用</span>' : '<span class="badge off">已停用</span>');
  out.push('<span class="badge">' + esc(p.kind) + '</span>');
  return out.join('');
}

/* 操作按钮（行内与移动端展开区共用）。
   危险操作（unload/disable）由点击委托做二次确认。 */
function opsHtml(p, forMobile) {
  if (p.builtin) return '';
  const cls = forMobile ? 'card-ops ops-mobile' : 'card-ops';
  const parts = [];
  const mk = (op, label, danger) =>
    '<button class="op' + (danger ? ' danger' : '') + '" data-op="' + op + '" data-entry="' + esc(p.entry) + '">'
    + label + '</button>';
  if (p.loaded) {
    parts.push(mk('unload', '卸载', true));
    parts.push(mk('load', '重载', false));
  } else if (p.enabled) {
    parts.push(mk('load', '加载', false));
  } else {
    parts.push(mk('enable', '启用', false));
  }
  if (p.enabled && p.entry !== 'plugin_manager') {
    parts.push(mk('disable', '停用', true));
  }
  if (!parts.length) return '';
  return '<div class="' + cls + '">' + parts.join('') + '</div>';
}

function chips(items, limit) {
  const list = (items || []).slice(0, limit);
  const rest = (items || []).length - list.length;
  return '<span class="chips">' + list.map(x => '<span class="badge">' + esc(x) + '</span>').join('')
    + (rest > 0 ? '<span class="badge">+' + rest + '</span>' : '') + '</span>';
}

/* routes 明细：前 4 条 + 折叠 */
function routesHtml(routes) {
  if (!routes || !routes.length) return '';
  const lines = routes.map(r => esc((r.method || 'GET') + ' ' + (r.path || r.prefix || '')));
  const head = lines.slice(0, 4).map(l => '<div>' + l + '</div>').join('');
  const more = lines.length > 4
    ? '<button class="routes-more">展开全部（' + lines.length + '）</button>'
    : '';
  return head + more;
}

/* web 贡献明细：panel/slot/annotator/style 的 id 与挂载点 */
function webHtml(web) {
  if (!web) return '';
  const rows = [];
  for (const p of web.panels || []) {
    rows.push('面板 <span class="badge">' + esc(p.id) + '</span> → ' + esc(p.slot || 'right')
      + (p.replaces ? '（接管 ' + esc(p.replaces) + '）' : ''));
  }
  for (const s of web.slots || []) {
    rows.push('槽位 <span class="badge">' + esc(s.slot_id) + '</span> @ ' + esc(s.slot));
  }
  for (const a of web.annotators || []) {
    rows.push('注解 <span class="badge">' + esc(a.id) + '</span>');
  }
  if (typeof web.styles === 'string' && web.styles.trim()) rows.push('样式 <span class="badge">√</span>');
  if (!rows.length) return '';
  return rows.map(r => '<div style="margin-bottom:2px">' + r + '</div>').join('');
}

function detailHtml(p, meta) {
  const rows = [];
  const dt = (k, v) => '<dt>' + k + '</dt><dd>' + v + '</dd>';
  rows.push(dt('名称', esc(p.name || p.entry) + (p.version && !p.builtin ? ' ' + esc(p.version) : '')));
  if (meta && meta.author) rows.push(dt('作者', esc(meta.author)));
  if (meta && meta.module) rows.push(dt('模块', esc(meta.module)));
  if (!p.builtin && p.file_name) rows.push(dt('文件', esc('plugins/' + p.file_name)));
  if (meta && meta.hooks && meta.hooks.length) rows.push(dt('hooks', chips(meta.hooks, 14)));
  if (meta && meta.tools && meta.tools.length)
    rows.push(dt('tools', chips(meta.tools.map(t => typeof t === 'string' ? t : t.name), 14)));
  if (meta && meta.routes && meta.routes.length) {
    rows.push(dt('routes', routesHtml(meta.routes)));
  }
  const w = webHtml(meta && meta.web);
  if (w) rows.push(dt('前端', w));
  let html = '<dl class="meta-grid">' + rows.join('') + '</dl>';
  if (!p.builtin && !p.loaded && p.error) {
    html += '<div class="errbox"><pre>' + esc(p.error) + '</pre></div>';
  }
  html += opsHtml(p, true); /* 移动端展开区操作按钮（桌面 CSS 隐藏） */
  return html;
}

function cardHtml(p) {
  const meta = p.name ? metaByName[p.name] : undefined;
  const key = cardKey(p);
  const st = stateOf(p);
  const isOpen = expanded.has(key);
  const desc = p.description || (meta && meta.description) || '';
  const ver = p.version && !p.builtin ? '<span class="pver">' + esc(p.version) + '</span>' : '';
  const sub = p.builtin ? 'engine 内置 · ' + (p.hooks || []).length + ' 个 hook 点'
    : esc(p.kind) + (p.file_name ? ' · plugins/' + esc(p.file_name) : '');
  const errLine = st === 'failed'
    ? '<div class="errline" title="' + esc(p.error) + '">加载失败：' + esc(p.error) + '</div>' : '';
  return '<div class="card st-' + st + (isOpen ? ' open' : '') + '" data-card="' + esc(key) + '"'
    + (p.entry ? ' data-entry="' + esc(p.entry) + '"' : '') + '>'
    + '<div class="card-main" data-toggle="' + esc(key) + '">'
    +   '<div class="card-line1"><span class="caret">' + (p.builtin ? '' : '▶') + '</span>'
    +     '<span class="pname">' + esc(p.name || p.entry) + '</span>' + ver
    +     '<span class="badges">' + badgeHtml(p) + '</span></div>'
    +   (desc ? '<div class="card-line2" title="' + esc(desc) + '">' + esc(desc) + '</div>' : '')
    +   '<div class="card-line3">' + sub + '</div>' + errLine
    +   opsHtml(p, false)
    + '</div>'
    + (isOpen ? '<div class="card-detail">' + detailHtml(p, meta) + '</div>' : '')
    + '</div>';
}

function renderList() {
  const listEl = document.getElementById('list');
  const kwMatched = allEntries.filter(p => matchKeyword(p));
  const shown = kwMatched.filter(matchFilter);
  const externals = shown.filter(p => !p.builtin);
  const builtins = shown.filter(p => p.builtin);

  if (!allEntries.length) {
    listEl.innerHTML = '<div class="empty">plugins/ 目录为空，尚无外部插件</div>';
    return;
  }
  if (!shown.length) {
    listEl.innerHTML = '<div class="empty">没有匹配' + (keyword ? '「' + esc(keyword) + '」' : '该筛选') + '的插件</div>';
    return;
  }

  let html = '';
  if (externals.length || builtins.length) {
    html += '<div class="section-head open"><span class="tw">▶</span>外部插件<span class="cnt">(' + externals.length + ')</span></div>';
    html += externals.map(cardHtml).join('');
  }
  if (builtins.length) {
    html += '<div class="section-head' + (builtinOpen ? ' open' : '') + '" data-toggle-builtin><span class="tw">▶</span>内置插件<span class="cnt">(' + builtins.length + ' · engine 进程，仅展示)</span></div>';
    if (builtinOpen) html += builtins.map(cardHtml).join('');
  }
  listEl.innerHTML = html;

  /* 操作完成后高亮 */
  if (lastActionEntry) {
    const el = listEl.querySelector('[data-entry="' + CSS.escape(lastActionEntry) + '"]');
    if (el) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1000);
    }
    lastActionEntry = null;
  }
}

/* ── 数据获取 ──────────────────────────────────────────── */

async function refresh() {
  /* 二次确认进行中不重渲染，避免按钮状态被轮询抹掉 */
  if (armed) return;
  const mySeq = ++seq;
  try {
    const [data, registry] = await Promise.all([
      api('/plugins/plugin_manager/list'),
      api('/plugins').catch(() => ({ plugins: [] })),
    ]);
    if (mySeq !== seq) return;
    metaByName = {};
    for (const rp of registry.plugins || []) metaByName[rp.name] = rp;
    allEntries = data.plugins || [];
    renderStats();
    renderFilters();
    renderList();
    say('共 ' + allEntries.length + ' 项 · ' + new Date().toLocaleTimeString());
  } catch (err) {
    if (mySeq !== seq) return;
    document.getElementById('list').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    say('列表获取失败：' + err.message, true);
  }
}

/* ── 事件 ──────────────────────────────────────────────── */

function disarm() {
  if (!armed) return;
  clearTimeout(armed.timer);
  const btn = document.querySelector(
    'button[data-op="' + armed.op + '"][data-entry="' + CSS.escape(armed.entry) + '"]');
  if (btn) { btn.classList.remove('armed'); btn.innerHTML = armed.html; btn.disabled = false; }
  armed = null;
}

const DANGER_CONFIRM = { unload: '确认卸载？', disable: '确认停用？' };

document.addEventListener('click', async (ev) => {
  /* 筛选 */
  const chip = ev.target.closest('button.chip[data-filter]');
  if (chip) { filter = chip.dataset.filter; renderFilters(); renderList(); return; }

  /* 分组折叠 */
  if (ev.target.closest('[data-toggle-builtin]')) {
    builtinOpen = !builtinOpen; renderList(); return;
  }

  /* 卡片展开/收起 */
  const main = ev.target.closest('[data-toggle]');
  if (main && !ev.target.closest('button')) {
    const key = main.dataset.toggle;
    expanded.has(key) ? expanded.delete(key) : expanded.add(key);
    renderList(); return;
  }

  /* routes 展开全部 */
  const moreBtn = ev.target.closest('button.routes-more');
  if (moreBtn) {
    const dd = moreBtn.closest('dd');
    if (dd) {
      const meta = null; /* 从最近的卡片重新取 */
      const cardEl = moreBtn.closest('[data-card]');
      const key = cardEl ? cardEl.dataset.card : '';
      const p = allEntries.find(x => cardKey(x) === key);
      const m = p && p.name ? metaByName[p.name] : null;
      if (m && m.routes) {
        dd.innerHTML = m.routes.map(r =>
          '<div>' + esc((r.method || 'GET') + ' ' + (r.path || r.prefix || '')) + '</div>').join('');
      }
    }
    return;
  }

  /* 操作按钮（含二次确认） */
  const btn = ev.target.closest('button[data-op]');
  if (!btn) return;
  const op = btn.dataset.op;
  const entry = btn.dataset.entry;

  if (DANGER_CONFIRM[op] && !btn.classList.contains('armed')) {
    disarm(); /* 切换确认目标 */
    armed = {
      op, entry, html: btn.innerHTML,
      timer: setTimeout(disarm, 3000),
    };
    btn.classList.add('armed');
    btn.innerHTML = DANGER_CONFIRM[op];
    return;
  }
  if (armed && armed.entry === entry && armed.op === op) disarm();

  btn.disabled = true;
  const siblings = btn.parentElement.querySelectorAll('button[data-op]');
  siblings.forEach(b => { b.disabled = true; });
  try {
    await api('/plugins/plugin_manager/' + entry + '/' + op, { method: 'POST' });
    say(entry + ' ' + op + ' 完成');
    lastActionEntry = entry;
    await refresh();
  } catch (err) {
    say(err.message, true);
    siblings.forEach(b => { b.disabled = false; });
  }
});

document.getElementById('refresh').addEventListener('click', () => { disarm(); refresh(); });

let searchTimer = null;
document.getElementById('search').addEventListener('input', (ev) => {
  keyword = ev.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderList, 120);
});

/* 轮询：页面隐藏时暂停，回到前台立即刷一次 */
setInterval(() => { if (!document.hidden) refresh(); }, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

refresh();
</script>
</body>
</html>
