[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clonoth-remote-worker"
version = "0.1.0"
description = "Remote worker SDK for Clonoth Supervisor broker tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["clonoth_remote_worker*"]
